    function PropertyListView({ properties, onViewDetail, showRegistrant, selectable, onBulkDelete }) {
      const [statusFilter, setStatusFilter] = useState('전체');
      const [addressFilter, setAddressFilter] = useState('');
      const [minPrice, setMinPrice] = useState('');
      const [maxPrice, setMaxPrice] = useState('');
      const [minLandArea, setMinLandArea] = useState('');
      const [maxLandArea, setMaxLandArea] = useState('');
      const [minYield, setMinYield] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      const [typeFilters, setTypeFilters] = useState([]);
      const [selectedIds, setSelectedIds] = useState([]);
      const [showBulkConfirm, setShowBulkConfirm] = useState(false);
      const toggleTypeFilter = (t) => setTypeFilters(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);

      const handleSort = (key) => {
        let direction = 'desc';
        if (sortConfig.key === key && sortConfig.direction === 'desc') direction = 'asc';
        setSortConfig({ key, direction });
      };

      const handleResetFilters = () => {
        setStatusFilter('전체'); setTypeFilters([]); setAddressFilter(''); setMinPrice(''); setMaxPrice(''); setMinLandArea(''); setMaxLandArea(''); setMinYield('');
      };

      const filteredAndSortedProperties = useMemo(() => {
        let result = [...properties];
        
        if (statusFilter !== '전체') result = result.filter(p => (p.status || '보류') === statusFilter);
        if (typeFilters.length > 0) result = result.filter(p => typeFilters.includes(p.transactionType));
        if (addressFilter.trim() !== '') result = result.filter(p => (p.address || '').includes(addressFilter.trim()));
        if (minPrice !== '' || maxPrice !== '') {
          const min = minPrice !== '' ? Number(minPrice) * 10000 : 0;
          const max = maxPrice !== '' ? Number(maxPrice) * 10000 : Infinity;
          result = result.filter(p => { const priceVal = p.transactionType === '매매' ? (p.price?.sale || 0) : (p.price?.deposit || 0); return priceVal >= min && priceVal <= max; });
        }
        if (minLandArea !== '' || maxLandArea !== '') {
          const min = minLandArea !== '' ? Number(minLandArea) : 0;
          const max = maxLandArea !== '' ? Number(maxLandArea) : Infinity;
          result = result.filter(p => { const py = Number(p.landArea || 0) * 0.3025; return py >= min && py <= max; });
        }
        if (minYield !== '') {
          const min = Number(minYield);
          result = result.filter(p => {
            if (p.transactionType !== '매매') return false; 
            const y = Number(getYield(p.price?.sale, p.price?.deposit, p.price?.rent));
            return y >= min;
          });
        }
        result.sort((a, b) => {
          if (sortConfig.key === 'date') return sortConfig.direction === 'desc' ? new Date(b.date || 0) - new Date(a.date || 0) : new Date(a.date || 0) - new Date(b.date || 0);
          if (sortConfig.key === 'yield') {
            const yA = Number(getYield(a.price?.sale, a.price?.deposit, a.price?.rent)); const yB = Number(getYield(b.price?.sale, b.price?.deposit, b.price?.rent));
            return sortConfig.direction === 'desc' ? yB - yA : yA - yB;
          }
          return 0;
        });
        return result;
      }, [properties, statusFilter, typeFilters, addressFilter, minPrice, maxPrice, minLandArea, maxLandArea, minYield, sortConfig]);

      const visibleIds = filteredAndSortedProperties.map(p => p.id);
      const checkedIds = selectedIds.filter(id => visibleIds.includes(id));
      const allChecked = visibleIds.length > 0 && checkedIds.length === visibleIds.length;
      const toggleOne = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const toggleAll = () => setSelectedIds(allChecked ? [] : visibleIds);
      const colCount = 13 + (showRegistrant ? 1 : 0) + (selectable ? 1 : 0);
      const counts = { '전체': properties.length };
      ['보류', '매매', '완료'].forEach(st => { counts[st] = properties.filter(p => (p.status || '보류') === st).length; });
      const TYPE_BADGE = { '매매': 'bg-sky-100 text-sky-800', '전세': 'bg-emerald-100 text-emerald-800', '월세': 'bg-rose-100 text-rose-800', '연세': 'bg-purple-100 text-purple-800' };
      const TYPE_BADGE_OFF = { '매매': 'text-sky-700 border-sky-200 hover:bg-sky-50', '전세': 'text-emerald-700 border-emerald-200 hover:bg-emerald-50', '월세': 'text-red-700 border-red-200 hover:bg-red-50' };
      const fieldCls = "h-8 px-2.5 border border-stone-300 rounded-md bg-white text-xs focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-400 transition-all placeholder-slate-400";
      const sortArrow = (key) => sortConfig.key === key ? (sortConfig.direction === 'desc' ? '↓' : '↑') : '↕';
      const th = "px-2.5 py-2.5 font-semibold text-[12px] text-slate-600 border-b border-stone-300 bg-stone-100 sticky top-0 whitespace-nowrap";

      return (
        <div className="bg-white rounded-3xl border border-stone-300 overflow-hidden w-full flex flex-col shadow-sm">
          {showBulkConfirm && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-200">
                <div className="flex items-center gap-3 mb-3 text-red-600"><Trash2 className="w-6 h-6" /><h3 className="text-lg font-bold text-ink-800">선택한 물건 삭제</h3></div>
                <p className="text-slate-600 mb-6 text-sm">선택한 <b>{checkedIds.length}건</b>을 삭제할까요?<br/>이 작업은 되돌릴 수 없습니다.</p>
                <div className="flex gap-3 justify-end">
                  <button type="button" onClick={() => setShowBulkConfirm(false)} className="flex-1 px-4 py-2.5 bg-slate-100 rounded-3xl text-slate-700 font-bold hover:bg-slate-200 transition-colors">취소</button>
                  <button type="button" onClick={() => { onBulkDelete(checkedIds); setSelectedIds([]); setShowBulkConfirm(false); }} className="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-3xl font-bold hover:bg-red-700 transition-colors shadow-md">삭제하기</button>
                </div>
              </div>
            </div>
          )}
          {/* 검색 조건: 컴퓨터는 한 줄로 촘촘하게, 폰은 "이름 | 입력칸" 두 칸으로 줄 맞춤 */}
          <div className="px-4 py-3 border-b border-stone-200 bg-stone-50 flex flex-col gap-2.5">
            <div className="flex flex-col gap-2.5 md:flex-row md:flex-wrap md:items-center md:gap-x-6 md:gap-y-2">
              <div className="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-2 md:flex">
                <span className="text-xs font-bold text-slate-600">거래방식</span>
                <div className="grid grid-cols-3 gap-1.5 md:flex md:gap-2">
                {['매매', '전세', '월세'].map(t => (
                  <button key={t} onClick={() => toggleTypeFilter(t)} className={`h-8 md:h-7 px-3 rounded-md text-xs font-bold border transition-colors ${typeFilters.includes(t) ? TYPE_BADGE[t] + ' border-transparent shadow-sm' : 'bg-white ' + TYPE_BADGE_OFF[t]}`}>{t}</button>
                ))}
                </div>
              </div>
              <div className="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-2 md:flex">
                <span className="text-xs font-bold text-slate-600">상태</span>
                <div className="grid grid-cols-4 gap-1.5 md:flex md:gap-1">
                  {['전체', '보류', '완료', '매매'].map(st => (
                    <button key={st} onClick={() => setStatusFilter(st)} className={`h-8 md:h-7 px-2 md:px-3 whitespace-nowrap rounded-md text-xs font-bold border transition-colors ${statusFilter === st ? 'bg-ink-900 text-gold-200 border-ink-900' : 'bg-white border-stone-300 text-slate-500 hover:text-ink-900'}`}>{st} <span className="opacity-60 font-medium">{counts[st]}</span></button>
                  ))}
                </div>
              </div>
            </div>
            <div className="flex flex-col gap-2.5 md:flex-row md:flex-wrap md:items-center md:gap-x-5 md:gap-y-2">
              <label className="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-2 text-xs font-bold text-slate-600 md:flex">소재지
                <input type="text" value={addressFilter} onChange={(e) => setAddressFilter(e.target.value)} className={fieldCls + " w-full md:w-32"} placeholder="동/구 입력" />
              </label>
              <label className="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-2 text-xs font-bold text-slate-600 md:flex">금액(억)
                <span className="flex items-center gap-2 min-w-0">
                  <input type="number" value={minPrice} onChange={(e) => setMinPrice(e.target.value)} className={fieldCls + " flex-1 min-w-0 md:flex-none md:w-16 text-center"} placeholder="최소" />
                  <span className="text-slate-300">~</span>
                  <input type="number" value={maxPrice} onChange={(e) => setMaxPrice(e.target.value)} className={fieldCls + " flex-1 min-w-0 md:flex-none md:w-16 text-center"} placeholder="최대" />
                </span>
              </label>
              <label className="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-2 text-xs font-bold text-slate-600 md:flex">면적(평)
                <span className="flex items-center gap-2 min-w-0">
                  <input type="number" value={minLandArea} onChange={(e) => setMinLandArea(e.target.value)} className={fieldCls + " flex-1 min-w-0 md:flex-none md:w-16 text-center"} placeholder="최소" />
                  <span className="text-slate-300">~</span>
                  <input type="number" value={maxLandArea} onChange={(e) => setMaxLandArea(e.target.value)} className={fieldCls + " flex-1 min-w-0 md:flex-none md:w-16 text-center"} placeholder="최대" />
                </span>
              </label>
              <label className="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-2 text-xs font-bold text-slate-600 md:flex">수익률(%)
                <input type="number" value={minYield} onChange={(e) => setMinYield(e.target.value)} className={fieldCls + " w-full md:w-20 md:text-center"} placeholder="최소 %" />
              </label>
              <div className="flex items-center justify-between gap-2 md:ml-auto md:justify-end md:gap-3">
                <span className="text-xs text-slate-500">검색 결과 <span className="font-bold text-ink-900">{filteredAndSortedProperties.length}</span>건</span>
                <div className="flex items-center gap-2">
                  {selectable && (
                  <button type="button" disabled={checkedIds.length === 0} onClick={() => setShowBulkConfirm(true)} className={`h-8 px-3 rounded-md text-xs font-bold flex items-center gap-1.5 border transition-colors ${checkedIds.length > 0 ? 'bg-red-600 border-red-600 text-white hover:bg-red-700 shadow-sm' : 'bg-white border-stone-300 text-slate-300 cursor-not-allowed'}`}><Trash2 className="w-3 h-3" /> 선택 삭제{checkedIds.length > 0 ? ` (${checkedIds.length})` : ''}</button>
                )}
                  <button onClick={handleResetFilters} className="h-8 px-3 text-xs font-bold text-slate-600 bg-white border border-stone-300 rounded-md hover:bg-stone-100 hover:text-ink-900 flex items-center gap-1.5 transition-colors">
                    <Sync className="w-3 h-3" /> 초기화
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="overflow-auto w-full max-h-none md:max-h-[calc(100vh-290px)]">
            <table className="w-full text-left border-collapse whitespace-nowrap min-w-[1000px]">
              <thead>
                <tr>
                  {selectable && <th className={th + " text-center w-10"}><input type="checkbox" checked={allChecked} onChange={toggleAll} title="전체 선택" className="w-4 h-4 accent-ink-900 cursor-pointer" /></th>}
                  <th className={th + " text-center"}>상태</th>
                  <th className={th}>종류</th>
                  <th className={th}>물건명</th>
                  <th className={th}>지번주소</th>
                  {showRegistrant && <th className={th}>등록자</th>}
                  <th className={th + " text-center"}>층수</th>
                  <th className={th + " text-right"}>대지(평)</th>
                  <th className={th + " text-right"}>연면(평)</th>
                  <th className={th + " text-center"}>방식</th>
                  <th className={th + " text-right"}>매매가</th>
                  <th className={th + " text-right"}>보증금</th>
                  <th className={th + " text-right"}>월세</th>
                  <th className={th + " text-center cursor-pointer select-none hover:bg-stone-200 text-emerald-700"} onClick={() => handleSort('yield')}>수익률 {sortArrow('yield')}</th>
                  <th className={th + " text-center cursor-pointer select-none hover:bg-stone-200"} onClick={() => handleSort('date')}>등록일 {sortArrow('date')}</th>
                </tr>
              </thead>
              <tbody className="text-[13px]">
                {filteredAndSortedProperties.length > 0 ? filteredAndSortedProperties.map((prop, idx) => (
                  <tr key={prop.id} onClick={() => onViewDetail(prop)} className="h-11 border-b border-stone-100 hover:bg-gold-100/70 cursor-pointer transition-colors">
                    {selectable && <td className="px-2.5 text-center" onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={checkedIds.includes(prop.id)} onChange={() => toggleOne(prop.id)} className="w-4 h-4 accent-ink-900 cursor-pointer" /></td>}
                    <td className="px-2.5 text-center"><span className={`px-2 py-0.5 rounded text-[11px] font-bold ${STATUS_BADGE_COLORS[prop.status || '보류']}`}>{prop.status || '보류'}</span></td>
                    <td className="px-2.5 text-slate-700">{prop.type}</td>
                    <td className="px-2.5 max-w-[190px]"><span className="flex items-center gap-1.5"><span className="font-semibold text-blue-600 hover:underline truncate" title={prop.name}>{prop.name}</span>{prop.is_shared && !showRegistrant && <span className="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold bg-gold-100 text-gold-700">공유</span>}</span></td>
                    <td className="px-2.5 max-w-[210px]">
                      <span className="flex items-center gap-1.5 text-slate-600">
                        <a href={`https://map.naver.com/v5/search/${encodeURIComponent(prop.address || '')}`} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} title="네이버 지도" className="text-purple-500 hover:text-purple-700 shrink-0"><MapPin className="w-3.5 h-3.5" /></a>
                        <span className="truncate" title={prop.address}>{prop.address}</span>
                      </span>
                    </td>
                    {showRegistrant && <td className="px-2.5 text-slate-700 text-xs">{prop.registrant || '-'}</td>}
                    <td className="px-2.5 text-center text-slate-600 text-xs">지상 {prop.floorGround || 0} · 지하 {prop.floorUnderground || 0}</td>
                    <td className="px-2.5 text-right text-slate-600">{getExactPyeong(prop.landArea)}</td>
                    <td className="px-2.5 text-right text-slate-600">{getExactPyeong(prop.totalFloorArea)}</td>
                    <td className="px-2.5 text-center"><span className={`px-2 py-0.5 rounded text-[11px] font-bold ${TYPE_BADGE[prop.transactionType] || 'bg-slate-500 text-white'}`}>{prop.transactionType}</span></td>
                    <td className="px-2.5 text-right font-bold text-red-600">{formatKoreanCurrency(prop.price?.sale || 0)}</td>
                    <td className="px-2.5 text-right text-slate-700">{formatKoreanCurrency(prop.price?.deposit || 0)}</td>
                    <td className="px-2.5 text-right text-slate-700">{formatKoreanCurrency(prop.price?.rent || 0)}</td>
                    <td className="px-2.5 text-center font-bold text-emerald-600">{prop.transactionType === '매매' ? `${getYield(prop.price?.sale, prop.price?.deposit, prop.price?.rent)}%` : '-'}</td>
                    <td className="px-2.5 text-center text-slate-500 text-xs">{prop.date}</td>
                  </tr>
                )) : <tr><td colSpan={colCount} className="p-12 text-center text-slate-500 font-medium bg-stone-50">조건에 맞는 물건이 없습니다.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function InfoSection({ title, icon, children }) {
      return (
        <section className="bg-white rounded-3xl overflow-hidden">
          <div className="bg-white text-ink-900 px-6 pt-5 pb-2 flex items-center gap-2 text-[17px] font-bold tracking-tight">
            <span className="text-gold-400">{icon}</span> {title}
          </div>
          {children}
        </section>
      );
    }

    function InfoGrid({ rows }) {
      return (
        <div>
          {rows.map(([label, value], i) => (
            <div key={label + i} className="flex border-b border-stone-200 last:border-b-0 min-h-[42px]">
              <div className="w-28 shrink-0 bg-stone-50 px-3 py-2.5 text-[12px] font-semibold text-slate-500 flex items-center border-r border-stone-200">{label}</div>
              <div className="flex-1 min-w-0 px-3 py-2.5 text-sm text-ink-800 font-medium flex items-center break-words">{value}</div>
            </div>
          ))}
        </div>
      );
    }

    function PropertyDetailView({ property, onBack, onEdit, onDelete, onReport, currentUser, onUpdate, readOnly, onToggleShare, comments = [], onAddComment, onDeleteComment }) {
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [newLog, setNewLog] = useState('');
      const [newComment, setNewComment] = useState('');
      const submitComment = () => { if (!newComment.trim()) return; onAddComment(property.id, newComment.trim()); setNewComment(''); };

      const floorTotals = useMemo(() => {
        if (!property || !property.floorDetails) return { deposit: 0, rent: 0, maintenance: 0 };
        return property.floorDetails.reduce((acc, curr) => ({
          deposit: acc.deposit + (Number(curr.deposit) || 0),
          rent: acc.rent + (Number(curr.rent) || 0),
          maintenance: acc.maintenance + (Number(curr.maintenance) || 0),
        }), { deposit: 0, rent: 0, maintenance: 0 });
      }, [property]);

      const handleAddLog = () => {
        if (!newLog.trim()) return;
        const log = {
          id: Date.now(),
          date: new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
          author: currentUser ? currentUser.name : '시스템', authorId: currentUser ? currentUser.loginId : '',
          content: newLog.trim()
        };
        const updatedProperty = { ...property, workLogs: [log, ...(property.workLogs || [])] };
        onUpdate(updatedProperty);
        setNewLog('');
      };

      const handleDeleteLog = (id) => {
        if (!confirm('이 작업 일지를 삭제할까요?')) return;
        onUpdate({ ...property, workLogs: (property.workLogs || []).filter(l => l.id !== id) });
      };

      if (!property) return null;

      const areaText = (v) => <span>{getExactPyeong(v)}평 <span className="text-slate-400 font-normal ml-1">({v || 0}㎡)</span></span>;
      const TYPE_BADGE = { '매매': 'bg-sky-100 text-sky-800', '전세': 'bg-emerald-100 text-emerald-800', '월세': 'bg-rose-100 text-rose-800' };
      const isSale = property.transactionType === '매매';

      return (
        <div className="max-w-[1400px] mx-auto space-y-5 pb-10 relative">
          {showDeleteConfirm && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-200">
                <div className="flex items-center gap-3 mb-3 text-red-600"><Trash2 className="w-6 h-6" /><h3 className="text-lg font-bold text-ink-800">물건 삭제 확인</h3></div>
                <p className="text-slate-600 mb-6 text-sm">정말 <b>{property.name}</b> 물건을 삭제하시겠습니까?<br/>이 작업은 되돌릴 수 없습니다.</p>
                <div className="flex gap-3 justify-end">
                  <button type="button" onClick={() => setShowDeleteConfirm(false)} className="flex-1 px-4 py-2.5 bg-slate-100 rounded-3xl text-slate-700 font-bold hover:bg-slate-200 transition-colors">취소</button>
                  <button type="button" onClick={() => onDelete(property.id)} className="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-3xl font-bold hover:bg-red-700 transition-colors shadow-md">삭제하기</button>
                </div>
              </div>
            </div>
          )}

          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <button type="button" onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-ink-900 transition-colors px-3 py-2 sm:-ml-3 rounded-lg hover:bg-white font-semibold text-sm"><ArrowLeft className="w-4 h-4" /> 목록으로</button>
            <div className="grid grid-cols-2 gap-2 w-full sm:flex sm:flex-wrap sm:w-auto">
              {!readOnly && (
                <button type="button" onClick={() => onToggleShare(property)} className={`only:col-span-2 whitespace-nowrap sm:flex-none px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm flex items-center justify-center gap-2 ${property.is_shared ? 'bg-gold-50 border border-gold-300 text-gold-700 hover:bg-gold-100' : 'bg-gold-400 hover:bg-gold-300 text-ink-900'}`}><ShareIcon className="w-4 h-4" /> {property.is_shared ? '공유 해제' : '공유하기'}</button>
              )}
              <button type="button" onClick={onReport} className="only:col-span-2 whitespace-nowrap sm:flex-none px-4 py-2.5 bg-ink-900 text-gold-200 rounded-lg text-sm font-semibold hover:bg-ink-700 transition-colors shadow-sm flex items-center justify-center gap-2"><FileText className="w-4 h-4" /> 컨설팅 리포트</button>
              {!readOnly && <button type="button" onClick={onEdit} className="only:col-span-2 whitespace-nowrap sm:flex-none px-4 py-2.5 bg-white border border-stone-300 rounded-lg text-sm font-semibold text-ink-900 hover:bg-stone-50 transition-colors shadow-sm">수정하기</button>}
              {!readOnly && <button type="button" onClick={() => setShowDeleteConfirm(true)} className="only:col-span-2 whitespace-nowrap sm:flex-none px-4 py-2.5 bg-white border border-red-200 text-red-600 rounded-lg text-sm font-semibold hover:bg-red-50 transition-colors shadow-sm">삭제하기</button>}
            </div>
          </div>

          {readOnly && (
            <div className="bg-gold-50 border border-gold-200 text-gold-700 rounded-lg px-4 py-2.5 text-sm font-medium flex items-center gap-2"><ShareIcon className="w-4 h-4" /> 공유 물건입니다. 수정은 등록자({property.registrant || '-'})의 개인 카드에서만 할 수 있어요. 코멘트는 누구나 남길 수 있습니다.</div>
          )}

          {/* 요약: 물건명 · 주소 · 대표 금액 */}
          <div className="bg-white rounded-3xl border border-stone-300 shadow-sm overflow-hidden">
            <div className="h-1 bg-gradient-to-r from-gold-400 via-gold-200 to-transparent"></div>
            <div className="p-5 sm:p-6 flex flex-col md:flex-row justify-between items-start gap-5">
              <div className="min-w-0">
                <div className="flex flex-wrap gap-1.5 mb-3">
                  <span className={`px-2.5 py-1 rounded text-xs font-bold ${STATUS_BADGE_COLORS[property.status || '보류']}`}>{property.status || '보류'}</span>
                  <span className={`px-2.5 py-1 rounded text-xs font-bold ${TYPE_BADGE[property.transactionType] || 'bg-slate-500 text-white'}`}>{property.transactionType}</span>
                  <span className="px-2.5 py-1 rounded text-xs font-medium bg-stone-100 text-slate-600 border border-stone-200">{property.type}</span>
                  {property.is_shared && <span className="px-2.5 py-1 rounded text-xs font-bold bg-gold-400 text-ink-900 flex items-center gap-1"><ShareIcon className="w-3 h-3" /> 공유중</span>}
                </div>
                <div className="flex flex-wrap items-center gap-3 mb-2">
                  <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight text-ink-900 leading-tight">{property.name}</h1>
                  <a href={`https://map.naver.com/v5/search/${encodeURIComponent(property.address || '')}`} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-[#03c75a] text-white rounded-lg text-xs font-bold shadow-sm hover:bg-[#02b350] transition-colors"><MapPin className="w-3 h-3" /> 네이버 지도</a>
                </div>
                <p className="text-slate-500 flex items-center gap-2 text-sm sm:text-base"><MapPin className="w-4 h-4 shrink-0 text-gold-500" />{property.address}</p>
              </div>
              <div className="text-left md:text-right w-full md:w-auto">
                <p className="text-xs text-slate-400 mb-1">{isSale ? '매매가' : property.transactionType === '전세' ? '전세보증금' : '보증금 / 월세'}</p>
                <div className="text-3xl sm:text-4xl font-semibold tracking-tight text-ink-900 flex flex-wrap items-baseline justify-start md:justify-end gap-1">
                  {isSale ? <span>{formatKoreanCurrency(property.price?.sale || 0)}</span>
                    : property.transactionType === '전세' ? <span>{formatKoreanCurrency(property.price?.deposit || 0)}</span>
                    : <><span>{formatKoreanCurrency(property.price?.deposit || 0)}</span><span className="text-slate-300 mx-1 text-2xl">/</span><span>{formatKoreanCurrency(property.price?.rent || 0)}</span></>}
                </div>
                {isSale && (
                  <div className="mt-3 flex flex-wrap md:justify-end items-center gap-2">
                    {property.landArea > 0 && <span className="text-xs font-semibold text-red-600 bg-red-50 px-2.5 py-1.5 rounded-lg">토지 평단가 약 {getPricePerPyeong(property.price?.sale, property.landArea).toLocaleString()}만원</span>}
                    <span className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200 text-xs font-bold"><TrendingUp className="w-3 h-3" /> 수익률 <span className="text-sm">{getYield(property.price?.sale, property.price?.deposit, property.price?.rent)}%</span></span>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* 위에서 아래로 차례로: 물건정보 → 물건금액 → 소유자 → 등록정보 → 층별 현황 → 코멘트 */}
          <div className="flex flex-col gap-5">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
              <InfoSection title="물건정보" icon={<Building2 className="w-4 h-4" />}>
                <InfoGrid rows={[
                  ['종류', property.type || '-'],
                  ['지번주소', property.address || '-'],
                  ['용도지역', property.zoning || '-'],
                  ['대지면적', areaText(property.landArea)],
                  ['연면적', areaText(property.totalFloorArea)],
                  ['지상층연면적', areaText(property.groundFloorArea)],
                  ['건축면적', areaText(property.buildingArea)],
                  ['층수', `지하 ${property.floorUnderground || 0}층 / 지상 ${property.floorGround || 0}층`],
                  ['건폐율', `${property.buildingCoverage || 0}%`],
                  ['용적률', `${property.floorAreaRatio || 0}%`],
                  ['주차대수', `${property.parking || 0}대`],
                  ['엘리베이터', `${property.elevators || 0}대`],
                  ['준공년도', property.completionYear || '-']
                ]} />
              </InfoSection>
            <div className="flex flex-col gap-4">
              <InfoSection title="물건금액" icon={<Banknote className="w-4 h-4" />}>
                <InfoGrid rows={[
                  ['거래방식', <span className="flex gap-1.5">{['매매', '전세', '월세'].map(t => <span key={t} className={`px-2.5 py-1 rounded text-xs font-bold ${property.transactionType === t ? TYPE_BADGE[t] : 'bg-stone-100 text-slate-300'}`}>{t}</span>)}</span>],
                  ['매매가', <span className="text-red-600 font-bold text-base">{formatKoreanCurrency(property.price?.sale || 0)}</span>],
                  ['보증금 (총액)', <b>{formatKoreanCurrency(property.price?.deposit || 0)}</b>],
                  ['월세 (총액)', <b>{formatKoreanCurrency(property.price?.rent || 0)}</b>],
                  ['관리비', <b>{formatKoreanCurrency(property.price?.maintenance || 0)}</b>],
                  ...(isSale ? [['수익률', <span className="text-emerald-600 font-bold text-base">{getYield(property.price?.sale, property.price?.deposit, property.price?.rent)}%</span>]] : [])
                ]} />
              </InfoSection>
          {readOnly ? (
            <InfoSection title="소유자 정보" icon={<Lock className="w-4 h-4" />}>
              <div className="px-4 py-7 text-center text-sm text-slate-400 flex items-center justify-center gap-2"><Lock className="w-4 h-4" /> 소유자 정보는 비공개입니다.</div>
            </InfoSection>
          ) : (
              <InfoSection title="소유자 정보" icon={<UserCircle className="w-4 h-4" />}>
                <InfoGrid rows={[
                  ['소유자명', <b className="text-ink-900">{property.ownerName || '-'}</b>],
                  ['연락처', <b className="text-ink-900">{property.ownerPhone || '-'}</b>]
                ]} />
              </InfoSection>
          )}
              <InfoSection title="등록 정보" icon={<CalendarDays className="w-4 h-4" />}>
                <InfoGrid rows={[
                  ['등록자', property.registrant || '-'],
                  ['등록자 연락처', property.registrantPhone || '-'],
                  ['등록일', property.date || '-']
                ]} />
              </InfoSection>
            </div>
          </div>

          <InfoSection title="층별 현황 내역" icon={<Maximize className="w-4 h-4" />}>
            <div className="p-0 overflow-x-auto w-full">
              <table className="w-full text-left border-collapse min-w-[500px]">
                <thead>
                  <tr className="bg-white text-slate-500 text-xs sm:text-sm border-b border-slate-200"><th className="p-3 sm:p-4 font-medium">층수</th><th className="p-3 sm:p-4 font-medium">업체명</th><th className="p-3 sm:p-4 font-medium text-right">보증금</th><th className="p-3 sm:p-4 font-medium text-right">월세</th><th className="p-3 sm:p-4 font-medium text-right">관리비</th></tr>
                </thead>
                <tbody>
                  {property.floorDetails && property.floorDetails.length > 0 ? property.floorDetails.map(floor => (
                    <tr key={floor.id} className="border-b border-slate-100 last:border-0 hover:bg-slate-50 text-xs sm:text-sm transition-colors">
                      <td className="p-3 sm:p-4 text-ink-800 font-bold">{floor.floor}</td>
                      <td className="p-3 sm:p-4 text-ink-800 font-semibold">{floor.companyName || '-'}</td>
                      <td className="p-3 sm:p-4 text-ink-800 font-semibold text-right">{formatKoreanCurrency(floor.deposit || 0)}</td>
                      <td className="p-3 sm:p-4 text-ink-800 font-semibold text-right">{formatKoreanCurrency(floor.rent || 0)}</td>
                      <td className="p-3 sm:p-4 text-ink-800 font-semibold text-right">{formatKoreanCurrency(floor.maintenance || 0)}</td>
                    </tr>
                  )) : <tr><td colSpan="5" className="p-6 sm:p-8 text-center text-slate-400 text-xs sm:text-sm">등록된 층별 내역이 없습니다.</td></tr>}
                </tbody>
                {property.floorDetails && property.floorDetails.length > 0 && (
                  <tfoot className="bg-blue-50/50 border-t-2 border-blue-200">
                    <tr><td colSpan="2" className="p-3 sm:p-4 text-blue-800 font-bold text-center text-xs sm:text-sm">전체 합계</td><td className="p-3 sm:p-4 text-blue-800 font-extrabold text-right text-sm sm:text-base">{formatKoreanCurrency(floorTotals.deposit)}</td><td className="p-3 sm:p-4 text-blue-800 font-extrabold text-right text-sm sm:text-base">{formatKoreanCurrency(floorTotals.rent)}</td><td className="p-3 sm:p-4 text-blue-800 font-extrabold text-right text-sm sm:text-base">{formatKoreanCurrency(floorTotals.maintenance)}</td></tr>
                  </tfoot>
                )}
              </table>
            </div>
          </InfoSection>

{!readOnly && (
            <InfoSection title="등록자 코멘트 (작업 일지)" icon={<FileText className="w-4 h-4" />}>
              <div className="p-4 flex flex-col gap-3">
                <div className="flex flex-col gap-2">
                  <textarea value={newLog} onChange={(e) => setNewLog(e.target.value)} className="w-full p-3 border border-stone-300 rounded-lg outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 text-sm resize-none" rows={3} placeholder="작업 내용이나 코멘트를 남겨주세요." />
                  <button type="button" onClick={handleAddLog} className="self-end px-5 py-2 bg-gold-400 hover:bg-gold-300 text-ink-900 text-sm font-bold rounded-lg transition-colors">등록</button>
                </div>
                <div className="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
                  {(property.workLogs || []).length > 0 ? property.workLogs.map(log => (
                    <div key={log.id} className="p-3 bg-stone-50 rounded-lg border border-stone-200 text-xs flex flex-col gap-1.5">
                      <div className="flex flex-wrap items-center justify-between gap-1 border-b border-stone-200 pb-1.5">
                        <span className="font-semibold text-slate-700 flex items-center gap-1.5"><UserCircle className="w-3.5 h-3.5 text-gold-500" /> {log.author}</span>
                        <span className="text-slate-400 flex items-center gap-2">{log.date}{canDeleteLog(log, currentUser) && <button type="button" onClick={() => handleDeleteLog(log.id)} className="px-2 py-0.5 rounded border border-red-200 text-red-500 hover:bg-red-50 font-semibold">삭제</button>}</span>
                      </div>
                      <p className="text-ink-800 whitespace-pre-line leading-relaxed text-[13px]">{log.content}</p>
                    </div>
                  )) : <div className="py-8 text-center text-slate-400 text-xs bg-stone-50 rounded-lg border border-dashed border-stone-200">등록된 작업 일지가 없습니다.</div>}
                </div>
              </div>
            </InfoSection>
          )}
          {(readOnly || property.is_shared) && (
            <InfoSection title="공유 코멘트" icon={<ShareIcon className="w-4 h-4" />}>
              <div className="p-4 flex flex-col gap-3">
                <div className="flex flex-col gap-2">
                  <textarea value={newComment} onChange={(e) => setNewComment(e.target.value)} className="w-full p-3 border border-stone-300 rounded-lg outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 text-sm resize-none" rows={3} placeholder="이 물건에 대한 의견이나 문의를 남겨주세요. (모든 직원에게 보여요)" />
                  <button type="button" onClick={submitComment} className="self-end px-5 py-2 bg-gold-400 hover:bg-gold-300 text-ink-900 text-sm font-bold rounded-lg transition-colors">코멘트 등록</button>
                </div>
                <div className="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
                  {comments.length > 0 ? [...comments].sort((x, y) => Number(String(y.id).replace(/\D/g, '')) - Number(String(x.id).replace(/\D/g, ''))).map(c => (
                    <div key={c.id} className="p-3 bg-stone-50 rounded-lg border border-stone-200 text-xs flex flex-col gap-1.5">
                      <div className="flex flex-wrap items-center justify-between gap-1 border-b border-stone-200 pb-1.5">
                        <span className="font-semibold text-slate-700 flex items-center gap-1.5"><UserCircle className="w-3.5 h-3.5 text-gold-500" /> {c.author}</span>
                        <span className="text-slate-400 flex items-center gap-2">{c.date}{currentUser && c.user_id === currentUser.loginId && onDeleteComment && (<button type="button" onClick={() => { if (confirm('이 코멘트를 삭제할까요?')) onDeleteComment(c.id); }} className="px-2 py-0.5 rounded border border-red-200 text-red-500 hover:bg-red-50 font-semibold">삭제</button>)}</span>
                      </div>
                      <p className="text-ink-800 whitespace-pre-line leading-relaxed text-[13px]">{c.content}</p>
                    </div>
                  )) : <div className="py-8 text-center text-slate-400 text-xs bg-stone-50 rounded-lg border border-dashed border-stone-200">아직 코멘트가 없습니다.</div>}
                </div>
              </div>
            </InfoSection>
          )}
          </div>
        </div>
      );
    }

    function PropertyFormView({ initialData, onBack, onSave, currentUser }) {
      const [newLog, setNewLog] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [pdfBusy, setPdfBusy] = useState(false);
      const [pdfInfo, setPdfInfo] = useState(null);
      const readPdf = async (file) => {
        if (!file) return;
        if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { setPdfInfo({ error: 'PDF 파일만 올릴 수 있어요.' }); return; }
        if (!window.pdfjsLib) { setPdfInfo({ error: 'PDF 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.' }); return; }
        setPdfBusy(true); setPdfInfo(null);
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
          const meta = await doc.getMetadata().catch(() => null);
          const pages = [];
          for (let i = 1; i <= doc.numPages; i++) {
            const page = await doc.getPage(i);
            const vp = page.getViewport({ scale: 1 });
            const tc = await page.getTextContent();
            pages.push({ width: vp.width, items: tc.items.filter(t => t.str && t.str.trim()).map(t => ({ s: t.str, x: t.transform[4], y: vp.height - t.transform[5], w: t.width })) });
          }
          const r = parsePropertyPdf(pages, { title: meta && meta.info && meta.info.Title });
          if (r.filled.length === 0) {
            setPdfInfo({ error: '이 PDF에서 물건 정보를 찾지 못했어요. 사진이나 스캔한 PDF이거나, 지원하지 않는 형식일 수 있어요.' });
          } else {
            setFormData(prev => ({ ...prev, ...r.fields, floorDetails: r.floors.length ? r.floors : prev.floorDetails }));
            if (r.notes.length) setNewLog(prev => prev || ('[PDF 참고사항]\n' + r.notes.map(n => '- ' + n).join('\n')));
            setPdfInfo({ ok: true, filled: r.filled, skipped: r.skipped, hasNotes: r.notes.length > 0, fileName: file.name });
          }
        } catch (e) {
          setPdfInfo({ error: 'PDF를 읽는 중 문제가 생겼어요: ' + e.message });
        } finally {
          setPdfBusy(false);
        }
      };
      const [formData, setFormData] = useState(() => {
        if (initialData) {
          return { 
            ...initialData,
            sale: initialData.price?.sale || '',
            deposit: initialData.price?.deposit || '',
            rent: initialData.price?.rent || '',
            maintenance: initialData.price?.maintenance || ''
          };
        }
        return {
          name: '', ownerName: '', ownerPhone: '',
          type: '빌딩', transactionType: '매매', address: '', zoning: '',
          landArea: '', totalFloorArea: '', groundFloorArea: '', buildingArea: '', buildingCoverage: '', floorAreaRatio: '', floorUnderground: '', floorGround: '', elevators: '', parking: '', completionYear: '',
          sale: '', deposit: '', rent: '', maintenance: '',
          floorDetails: [{ id: Date.now(), floor: '1층', companyName: '', deposit: '', rent: '', maintenance: '' }],
          direction: '남향', workLogs: [], status: '보류'
        };
      });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const newData = { ...prev, [name]: value };

          if (name === 'landArea' || name === 'buildingArea') {
            const land = Number(name === 'landArea' ? value : prev.landArea);
            const build = Number(name === 'buildingArea' ? value : prev.buildingArea);
            if (land > 0 && build > 0) {
              newData.buildingCoverage = ((build / land) * 100).toFixed(2).replace(/\.00$/, '');
            } else if (value === '') {
              newData.buildingCoverage = ''; 
            }
          }

          if (name === 'landArea' || name === 'groundFloorArea') {
            const land = Number(name === 'landArea' ? value : prev.landArea);
            const ground = Number(name === 'groundFloorArea' ? value : prev.groundFloorArea);
            if (land > 0 && ground > 0) {
              newData.floorAreaRatio = ((ground / land) * 100).toFixed(2).replace(/\.00$/, '');
            } else if (value === '') {
              newData.floorAreaRatio = ''; 
            }
          }

          return newData;
        });
      };
      
      const handleAddressBlur = () => {
        const formatted = autoFormatAddress(formData.address);
        setFormData(prev => ({ ...prev, address: formatted }));
      };

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files);
        const newImages = files.map(file => URL.createObjectURL(file));
        setFormData(prev => ({ ...prev, images: [...(prev.images || []), ...newImages] }));
      };

      const removeImage = (index) => setFormData(prev => {
        const newImages = [...(prev.images || [])];
        newImages.splice(index, 1);
        return { ...prev, images: newImages };
      });

      const handleFloorChange = (id, field, value) => {
        setFormData(prev => ({
          ...prev,
          floorDetails: prev.floorDetails.map(item => item.id === id ? { ...item, [field]: value } : item)
        }));
      };

      const sortFloorDetails = () => {
        const parseFloorLevel = (str) => {
          if(!str) return 0;
          if (/옥상|옥탑|PH|루프/i.test(str)) return 1000;
          const mm = str.match(/\d+/);
          const num = mm ? parseInt(mm[0], 10) : 0;
          if (str.includes('지하') || str.toUpperCase().includes('B')) return -num;
          return num;
        };

        setFormData(prev => {
          const sorted = [...prev.floorDetails].sort((a, b) => parseFloorLevel(a.floor) - parseFloorLevel(b.floor));
          return { ...prev, floorDetails: sorted };
        });
      };

      const addFloor = () => {
        setFormData(prev => {
          const groundFloors = prev.floorDetails
            .map(f => f.floor)
            .filter(f => f && !f.includes('지하') && !f.toUpperCase().includes('B'))
            .map(f => parseInt(f.replace(/[^0-9]/g, ''), 10))
            .filter(n => !isNaN(n));
          
          const maxGround = groundFloors.length > 0 ? Math.max(...groundFloors) : 0;
          const nextFloor = `${maxGround + 1}층`;

          return {
            ...prev,
            floorDetails: [...prev.floorDetails, { id: Date.now(), floor: nextFloor, companyName: '', deposit: '', rent: '', maintenance: '', isNew: true }]
          };
        });
      };

      const handleAddLog = () => {
        if (!newLog.trim()) return;
        const log = {
          id: Date.now(),
          date: new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
          author: currentUser ? currentUser.name : '등록자', authorId: currentUser ? currentUser.loginId : '',
          content: newLog.trim()
        };
        setFormData(prev => ({
          ...prev,
          workLogs: [log, ...(prev.workLogs || [])]
        }));
        setNewLog('');
      };

      const totals = useMemo(() => {
        const details = formData.floorDetails || [];
        return details.reduce((acc, curr) => ({
          deposit: acc.deposit + (Number(curr.deposit) || 0),
          rent: acc.rent + (Number(curr.rent) || 0),
          maintenance: acc.maintenance + (Number(curr.maintenance) || 0),
        }), { deposit: 0, rent: 0, maintenance: 0 });
      }, [formData.floorDetails]);

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!formData.name || formData.name.trim() === '') return alert("물건명을 입력해주세요.");
        if (!formData.address || formData.address.trim() === '') return alert("소재지(주소)를 입력해주세요.");

        setIsSubmitting(true);

        try {
          const formattedAddress = autoFormatAddress(formData.address);
          
          const parseFloorLevel = (str) => {
            if(!str) return 0;
            if (/옥상|옥탑|PH|루프/i.test(str)) return 1000;
            const mm = str.match(/\d+/);
            const num = mm ? parseInt(mm[0], 10) : 0;
            if (str.includes('지하') || str.toUpperCase().includes('B')) return -num;
            return num;
          };

          const sortedFloors = [...(formData.floorDetails || [])].sort((a, b) => parseFloorLevel(a.floor) - parseFloorLevel(b.floor));
          
          let finalWorkLogs = [...(formData.workLogs || [])];
          if (newLog.trim()) {
            finalWorkLogs.unshift({
              id: Date.now(),
              date: new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
              author: currentUser ? currentUser.name : '등록자', authorId: currentUser ? currentUser.loginId : '',
              content: newLog.trim()
            });
          }

          const cleanFormData = { ...formData };
          delete cleanFormData.sale; delete cleanFormData.deposit; delete cleanFormData.rent; delete cleanFormData.maintenance; delete cleanFormData.direction; delete cleanFormData.is_shared;
          if (formData.is_shared === true || (initialData && initialData.is_shared !== undefined)) cleanFormData.is_shared = !!formData.is_shared;

          await onSave({
            ...cleanFormData,
            address: formattedAddress,
            floorDetails: sortedFloors,
            landArea: Number(formData.landArea || 0),
            totalFloorArea: Number(formData.totalFloorArea || 0),
            groundFloorArea: Number(formData.groundFloorArea || 0),
            buildingArea: Number(formData.buildingArea || 0),
            buildingCoverage: Number(formData.buildingCoverage || 0),
            floorAreaRatio: Number(formData.floorAreaRatio || 0),
            floorUnderground: Number(formData.floorUnderground || 0),
            floorGround: Number(formData.floorGround || 0),
            elevators: Number(formData.elevators || 0),
            parking: Number(formData.parking || 0),
            price: { sale: Number(formData.sale || 0), deposit: totals.deposit, rent: totals.rent, maintenance: totals.maintenance },
            workLogs: finalWorkLogs,
          });
        } catch (error) {
            alert("저장 준비 중 오류 발생: " + error.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto pb-10 relative">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-6 w-full md:w-auto">
              <h2 className="text-xl sm:text-2xl font-bold text-ink-800 shrink-0">{initialData ? '등록된 물건 수정' : '신규 물건 등록'}</h2>
              <button type="button" onClick={() => setFormData(prev => ({ ...prev, is_shared: !prev.is_shared }))} title="켜면 모든 직원의 '공유 물건'에 보여요. 소유자 정보는 가려집니다." className={`flex items-center justify-center gap-2 px-4 py-2 rounded-3xl text-xs sm:text-sm font-bold border transition-all w-full sm:w-auto ${formData.is_shared ? 'bg-gold-400 border-gold-400 text-ink-900 shadow' : 'bg-white border-slate-300 text-slate-500 hover:text-ink-800'}`}><ShareIcon className="w-4 h-4" /> 공유 물건 {formData.is_shared ? 'ON' : 'OFF'}</button>
            </div>
            <div className="flex items-center gap-2 w-full md:w-auto">
              <button type="button" onClick={onBack} className="flex-1 md:flex-none text-slate-500 hover:text-ink-800 text-sm font-bold bg-slate-200 px-4 py-2.5 sm:py-2 rounded-lg text-center transition-colors">취소 및 돌아가기</button>
            </div>
          </div>

          <form onSubmit={handleSubmit} onKeyDown={(e) => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); }} className="space-y-4 sm:space-y-6">
            {!initialData && (
              <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); readPdf(e.dataTransfer.files[0]); }} className="rounded-3xl border-2 border-dashed border-gold-300 bg-gold-50/70 p-5 sm:p-6">
                <div className="flex flex-col sm:flex-row items-center gap-4">
                  <div className="w-12 h-12 rounded-3xl bg-gold-400 text-ink-900 flex items-center justify-center shrink-0"><FileText className="w-6 h-6" /></div>
                  <div className="flex-1 text-center sm:text-left">
                    <p className="font-bold text-ink-800">PDF로 자동 입력</p>
                    <p className="text-sm text-slate-500 mt-0.5">매물 소개서 PDF를 끌어다 놓거나 선택하면 아래 입력칸이 채워져요. 파일은 이 컴퓨터에서만 읽고 밖으로 보내지 않아요.</p>
                  </div>
                  <label className="px-5 py-2.5 rounded-3xl bg-ink-900 text-gold-200 text-sm font-bold cursor-pointer hover:bg-ink-700 transition-colors whitespace-nowrap">
                    {pdfBusy ? '읽는 중...' : 'PDF 선택'}
                    <input type="file" accept="application/pdf,.pdf" className="hidden" onChange={(e) => { readPdf(e.target.files[0]); e.target.value = ''; }} />
                  </label>
                </div>
                <p className="mt-3 text-sm font-bold text-red-600 text-center sm:text-left">※ PDF 자동 입력은 완벽하지 않아요. 잘못 읽히거나 빠진 내용이 있을 수 있으니, 꼭 내용을 확인한 뒤 등록해 주세요.</p>
                {pdfInfo && pdfInfo.error && <div className="mt-4 p-3 bg-red-50 border border-red-100 text-red-600 text-sm font-semibold rounded-lg">{pdfInfo.error}</div>}
                {pdfInfo && pdfInfo.ok && (
                  <div className="mt-4 p-4 bg-white border border-gold-200 rounded-3xl text-sm text-slate-700 space-y-1.5">
                    <p className="font-bold text-ink-800">✓ {pdfInfo.fileName}에서 {pdfInfo.filled.length}개 항목을 채웠어요. 내용을 확인한 뒤 저장해 주세요.</p>
                    <p><span className="font-semibold">채운 항목:</span> {pdfInfo.filled.join(', ')}</p>
                    {pdfInfo.skipped.length > 0 && <p className="text-slate-500"><span className="font-semibold">넣지 않은 항목(카드에 칸이 없거나 자동 계산돼요):</span> {pdfInfo.skipped.join(', ')}</p>}
                    {pdfInfo.hasNotes && <p className="text-slate-500">PDF의 참고사항은 맨 아래 <b>작업 일지</b> 입력칸에 넣어 두었어요. 필요 없으면 지우고 저장하세요.</p>}
                  </div>
                )}
              </div>
            )}
            <div className="bg-white p-5 sm:p-8 rounded-3xl shadow-sm border border-slate-200">

    function CustomerListView({ customers, shared, onToggleShare, onViewDetail, selectable, onBulkDelete }) {
      const [selectedIds, setSelectedIds] = useState([]);
      const [showBulkConfirm, setShowBulkConfirm] = useState(false);
      const [minEok, setMinEok] = useState('');
      const [maxEok, setMaxEok] = useState('');
      const shown = customers.filter(c => {
        const budget = Number(c.budget) || 0;
        if (minEok !== '' && budget < Number(minEok)) return false;
        if (maxEok !== '' && budget > Number(maxEok)) return false;
        return true;
      });
      const filtering = minEok !== '' || maxEok !== '';
      const checkedIds = selectedIds.filter(id => customers.some(c => c.id === id));
      const allChecked = shown.length > 0 && shown.every(c => checkedIds.includes(c.id));
      const toggleAll = () => setSelectedIds(allChecked ? checkedIds.filter(id => !shown.some(c => c.id === id)) : [...new Set([...checkedIds, ...shown.map(c => c.id)])]);
      const toggleOne = (id) => setSelectedIds(checkedIds.includes(id) ? checkedIds.filter(x => x !== id) : [...checkedIds, id]);
      const money = formatEok;
      const th = "p-3 md:p-4 font-medium whitespace-nowrap";
      const td = "p-3 md:p-4 text-slate-600 whitespace-nowrap";

        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden w-full">

            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-200">
                <div className="flex items-center gap-3 mb-3 text-red-600"><Trash2 className="w-6 h-6" /><h3 className="text-lg font-bold text-ink-800">선택한 매수자 삭제</h3></div>

                <div className="flex gap-3 justify-end">
                  <button type="button" onClick={() => setShowBulkConfirm(false)} className="flex-1 px-4 py-2.5 bg-slate-100 rounded-3xl text-slate-700 font-bold hover:bg-slate-200 transition-colors">취소</button>
                  <button type="button" onClick={() => { onBulkDelete(checkedIds); setSelectedIds([]); setShowBulkConfirm(false); }} className="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-3xl font-bold hover:bg-red-700 transition-colors shadow-md">삭제하기</button>
                </div>
              </div>
            </div>
          )}
          <div className="p-4 md:p-5 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3 bg-slate-50/50">

            <div className="flex flex-wrap items-center gap-2 text-xs md:text-sm">
              <span className="font-bold text-slate-700">금액(억)</span>
              <input type="text" inputMode="decimal" value={minEok} onChange={(e) => setMinEok(cleanMoneyInput(e.target.value))} placeholder="최소" className="w-20 h-9 px-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500 text-right bg-white" />
              <span className="text-slate-400">~</span>
              <input type="text" inputMode="decimal" value={maxEok} onChange={(e) => setMaxEok(cleanMoneyInput(e.target.value))} placeholder="최대" className="w-20 h-9 px-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500 text-right bg-white" />
              <button type="button" onClick={() => { setMinEok(''); setMaxEok(''); }} className="h-9 px-3 rounded-lg border border-slate-300 bg-white font-bold text-slate-600 hover:bg-slate-50">초기화</button>
              {selectable && (
                <button type="button" disabled={checkedIds.length === 0} onClick={() => setShowBulkConfirm(true)} className={`h-9 px-3 rounded-lg text-xs md:text-sm font-bold flex items-center gap-1.5 border transition-colors ${checkedIds.length > 0 ? 'bg-red-600 border-red-600 text-white hover:bg-red-700 shadow-sm' : 'bg-white border-slate-300 text-slate-300 cursor-not-allowed'}`}><Trash2 className="w-3.5 h-3.5" /> 선택 삭제{checkedIds.length > 0 ? ` (${checkedIds.length})` : ''}</button>
              )}
            </div>
          </div>
          {shared && <div className="px-4 md:px-5 py-2.5 bg-blue-50 text-blue-800 text-xs md:text-sm font-semibold border-b border-blue-100">모든 직원이 볼 수 있는 매수자예요. 이름과 전화번호는 공개되지 않아요.</div>}
          <div className="overflow-x-auto w-full">
            <table className="w-full text-left border-collapse min-w-[720px]">

                  {selectable && <th className={th + " w-10 text-center"}><input type="checkbox" checked={allChecked} onChange={toggleAll} title="전체 선택" className="w-4 h-4 accent-blue-600 cursor-pointer" /></th>}
                  {!shared && <th className={th}>이름</th>}{!shared && <th className={th}>전화번호</th>}
                  <th className={th}>투자금액</th><th className={th}>희망 지역</th><th className={th}>건물 유형</th><th className="p-3 md:p-4 font-medium">구매사유</th>
                  {shared && <th className={th}>등록자</th>}{shared && <th className={th}>등록일</th>}
                  {!shared && <th className={th + " text-center"}>공유</th>}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-xs md:text-sm">
                {shown.map(cust => (
                  <tr key={cust.id} onClick={() => onViewDetail && onViewDetail(cust)} className="hover:bg-blue-50/50 transition-colors align-top cursor-pointer">
                    {selectable && <td className="p-3 md:p-4 text-center" onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={checkedIds.includes(cust.id)} onChange={() => toggleOne(cust.id)} className="w-4 h-4 accent-blue-600 cursor-pointer" /></td>}
                    {!shared && <td className="p-3 md:p-4 font-bold text-ink-800 whitespace-nowrap">{cust.name}</td>}{!shared && <td className={td}>{cust.phone}</td>}
                    <td className="p-3 md:p-4 font-bold text-red-600 whitespace-nowrap">{money(cust.budget)}</td>
                    <td className={td}>{cust.region}</td>
                    <td className={td}>{cust.buildingtype || '-'}</td>
                    <td className="p-3 md:p-4 text-slate-600 whitespace-pre-line min-w-[260px]">{cust.reason}</td>
                    {shared && <td className={td}>{cust.registrant}</td>}{shared && <td className={td}>{cust.date}</td>}
                    {!shared && <td className="p-3 md:p-4 text-center"><button type="button" onClick={(e) => { e.stopPropagation(); onToggleShare && onToggleShare(cust.id); }} title="공유 매수자에 올리거나 내리기" className={`px-3 py-1 rounded-full text-xs font-bold border transition-colors ${cust.is_shared ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-300'}`}>{cust.is_shared ? '공유 중' : '비공개'}</button></td>}
                  </tr>
                ))}
                {shown.length === 0 && <tr><td colSpan={8} className="p-8 text-center text-slate-400">{shared ? '공유된 매수자가 없습니다.' : '조건에 맞는 매수자가 없습니다.'}</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ProfileModal({ user, onClose, onSave }) {
      const [form, setForm] = useState({ name: user.name || '', department: user.department || '', phone: user.phone || '' });
      const [saving, setSaving] = useState(false);

    function CalendarView({ currentUser, properties, memos, setMemos, onDbError }) {
      const [date, setDate] = useState(new Date());
      const [editingDate, setEditingDate] = useState(null);
      const [newMemo, setNewMemo] = useState('');
      const pad2 = (n) => String(n).padStart(2, '0');
      const todayObj = new Date();
      const [selectedDay, setSelectedDay] = useState(`${todayObj.getFullYear()}-${pad2(todayObj.getMonth() + 1)}-${pad2(todayObj.getDate())}`);
      const [phoneMemo, setPhoneMemo] = useState('');

      const year = date.getFullYear();
      const month = date.getMonth();

      const handleAddMemo = (e, dayStr) => { 
        e.stopPropagation(); 
        setEditingDate(dayStr); 
        setNewMemo(''); 
      };

      const saveMemo = async (e, dayStr) => { 
        e.stopPropagation(); 
        if (newMemo.trim()) {
          const newMemoObj = { id: `M-${Date.now()}`, user_id: currentUser.loginId, dateStr: dayStr, text: newMemo.trim() };
          
          setMemos(prev => [...prev, newMemoObj]);
          setEditingDate(null); 

          const { error } = await supabase.from('crm_memos').insert([newMemoObj]);
          if (error && onDbError) onDbError(error, 'crm_memos');
        }
      };

      const deleteMemo = async (e, id) => { 
        e.stopPropagation(); 
        setMemos(prev => prev.filter(m => m.id !== id)); 
        
        const { error } = await supabase.from('crm_memos').delete().eq('id', id);
        if (error && onDbError) onDbError(error, 'crm_memos');
      };

      const addPhoneMemo = async () => {
        if (!phoneMemo.trim() || !selectedDay) return;
        const memoObj = { id: `M-${Date.now()}`, user_id: currentUser.loginId, dateStr: selectedDay, text: phoneMemo.trim() };
        setMemos(prev => [...prev, memoObj]);
        setPhoneMemo('');
        const { error } = await supabase.from('crm_memos').insert([memoObj]);
        if (error && onDbError) onDbError(error, 'crm_memos');
      };

      // 폰: 칸에는 날짜와 점만 보여 주고, 눌러서 고른 날의 일정은 아래 패널에 크게 보여 준다
      const renderPhoneDays = () => {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push(<div key={`pe-${i}`} className="h-14"></div>);
        for (let d = 1; d <= daysInMonth; d++) {
          const dayStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
          const dow = new Date(year, month, d).getDay();
          const isToday = todayObj.getFullYear() === year && todayObj.getMonth() === month && todayObj.getDate() === d;
          const memoCount = memos.filter(m => m.dateStr === dayStr && m.user_id === currentUser.loginId).length;
          const doneCount = properties.filter(p => p.user_id === currentUser.loginId && p.date === dayStr && p.status === '완료').length;
          const selected = selectedDay === dayStr;
          cells.push(
            <button type="button" key={d} onClick={() => setSelectedDay(dayStr)} className={`h-14 rounded-xl flex flex-col items-center pt-1.5 gap-1 border transition-colors ${selected ? 'border-blue-500 bg-blue-50' : isToday ? 'border-blue-200 bg-blue-50/40' : 'border-slate-100 bg-white'}`}>
              <span className={`text-sm font-semibold ${dow === 0 ? 'text-red-500' : dow === 6 ? 'text-blue-500' : 'text-slate-700'} ${isToday ? 'underline' : ''}`}>{d}</span>
              <span className="flex items-center gap-0.5 h-1.5">
                {memoCount > 0 && <i className="w-1.5 h-1.5 rounded-full bg-slate-400 block"></i>}
                {memoCount > 1 && <i className="w-1.5 h-1.5 rounded-full bg-slate-300 block"></i>}
                {doneCount > 0 && <i className="w-1.5 h-1.5 rounded-full bg-blue-700 block"></i>}
              </span>
            </button>
          );
        }
        return cells;
      };

      const renderDays = () => {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const days = [];
        
        for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} onClick={() => { if (editingDate) { setEditingDate(null); setNewMemo(''); } }} className="bg-slate-50 border border-slate-100 rounded-lg"></div>);
        for (let d = 1; d <= daysInMonth; d++) {
          const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
          const currentDayOfWeek = new Date(year, month, d).getDay();
          const dayColor = currentDayOfWeek === 0 ? 'text-red-500' : currentDayOfWeek === 6 ? 'text-blue-500' : 'text-slate-700';

          const currentMemos = memos.filter(m => m.dateStr === dayStr && m.user_id === currentUser.loginId);
          const completedCount = properties.filter(p => p.user_id === currentUser.loginId && p.date === dayStr && p.status === '완료').length;

          days.push(
            <div key={d} onClick={(e) => { if (!editingDate) handleAddMemo(e, dayStr); else if (editingDate !== dayStr) { setEditingDate(null); setNewMemo(''); } }} className={`group relative min-h-[100px] md:min-h-[130px] p-1 md:p-2 border border-slate-100 rounded-lg cursor-pointer hover:border-blue-300 transition-colors ${isToday ? 'bg-blue-50/30 border-blue-200' : 'bg-white'}`}>
              <div className="flex justify-between items-start mb-1">
                <div className={`text-xs md:text-sm font-semibold ${dayColor} ${isToday ? 'font-extrabold underline' : ''}`}>{d}</div>
                <button type="button" onClick={(e) => handleAddMemo(e, dayStr)} className="w-5 h-5 rounded-full hover:bg-slate-100 text-slate-300 hover:text-blue-600 flex items-center justify-center opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-all"><Plus className="w-3 h-3" /></button>
              </div>
              
              <div className="space-y-1 flex flex-col">
                {currentMemos.map((memo) => (
                  <div key={memo.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center text-[10px] md:text-[11px] bg-blue-50 text-blue-700 pl-1.5 pr-1 py-1 rounded border border-blue-100 hover:bg-blue-100 transition-colors group/item gap-1 sm:gap-0">
                    <span className="truncate w-full sm:flex-1" title={memo.text}>{memo.text}</span>
                    <button type="button" onClick={(e) => deleteMemo(e, memo.id)} className="text-slate-400 hover:text-red-500 p-0.5 ml-auto sm:ml-1 opacity-100 md:opacity-0 md:group-hover/item:opacity-100 transition-opacity"><Trash2 className="w-3 h-3" /></button>
                  </div>
                ))}

                {completedCount > 0 && (
                  <div className="inline-flex items-center gap-1 text-[10px] md:text-[11px] font-bold bg-blue-100 text-blue-800 px-1.5 py-1 rounded border border-blue-200 mt-0.5 w-max">
                    <span className="w-1.5 h-1.5 rounded-full bg-blue-700"></span>
                    완료: {completedCount}건
                  </div>
                )}

                {editingDate === dayStr && (
                  <div className="mt-1" onClick={e => e.stopPropagation()}>
                    <input autoFocus type="text" value={newMemo} onChange={e => setNewMemo(e.target.value)} onKeyDown={e => e.key === 'Enter' && saveMemo(e, dayStr)} placeholder="일정 입력..." className="w-full text-[10px] md:text-xs p-1 md:p-1.5 border border-blue-300 rounded outline-none" />
                  </div>
                )}
              </div>
            </div>
          );
        }
        return days;
      };

      const selInMonth = selectedDay && selectedDay.startsWith(`${year}-${pad2(month + 1)}-`);
      const selMemos = selInMonth ? memos.filter(m => m.dateStr === selectedDay && m.user_id === currentUser.loginId) : [];
      const selDone = selInMonth ? properties.filter(p => p.user_id === currentUser.loginId && p.date === selectedDay && p.status === '완료').length : 0;
      const selDate = selInMonth ? new Date(selectedDay + 'T00:00:00') : null;

      return (
        <div className="bg-white p-4 md:p-6 rounded-3xl shadow h-full flex flex-col">
          <div className="flex justify-between items-center mb-4 md:mb-6 gap-2">
            <h2 className="text-lg md:text-xl font-bold whitespace-nowrap"><CalendarIcon className="w-5 h-5 md:w-6 md:h-6 inline text-blue-600 mr-2"/>개인 캘린더</h2>
            <div className="flex items-center gap-1 md:gap-4">
              <button type="button" onClick={() => setDate(new Date(year, month - 1, 1))} className="p-2 hover:bg-slate-100 rounded-full"><ChevronLeft className="w-5 h-5"/></button>
              <span className="font-bold text-base md:text-lg whitespace-nowrap">{year}년 {month + 1}월</span>
              <button type="button" onClick={() => setDate(new Date(year, month + 1, 1))} className="p-2 hover:bg-slate-100 rounded-full"><ChevronRight className="w-5 h-5"/></button>
            </div>
          </div>
          <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2 text-center font-bold text-xs md:text-sm">
            <div className="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div className="text-blue-500">토</div>
          </div>
          <div className="hidden md:grid grid-cols-7 gap-2 flex-1 overflow-y-auto">{renderDays()}</div>
          <div className="md:hidden">
            <div className="grid grid-cols-7 gap-1">{renderPhoneDays()}</div>
            <div className="mt-4 p-4 rounded-2xl bg-slate-50 border border-slate-200">
              {selDate ? (
                <>
                  <div className="flex items-center justify-between gap-2 mb-3">
                    <h3 className="font-bold text-sm text-ink-800">{month + 1}월 {selDate.getDate()}일 ({['일', '월', '화', '수', '목', '금', '토'][selDate.getDay()]})</h3>
                    {selDone > 0 && <span className="inline-flex items-center gap-1 text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded-full border border-blue-200"><span className="w-1.5 h-1.5 rounded-full bg-blue-700"></span>완료 {selDone}건</span>}
                  </div>
                  <div className="space-y-2">
                    {selMemos.length === 0 && <p className="text-sm text-slate-400">등록된 일정이 없어요.</p>}
                    {selMemos.map(memo => (
                      <div key={memo.id} className="flex items-start justify-between gap-2 bg-white border border-blue-100 rounded-xl px-3 py-2 text-sm text-blue-800">
                        <span className="break-words min-w-0">{memo.text}</span>
                        <button type="button" onClick={(e) => deleteMemo(e, memo.id)} className="text-slate-400 hover:text-red-500 p-1 shrink-0" title="삭제"><Trash2 className="w-4 h-4" /></button>
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2 mt-3">
                    <input type="text" value={phoneMemo} onChange={(e) => setPhoneMemo(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addPhoneMemo()} placeholder="일정 입력..." className="flex-1 min-w-0 h-10 px-3 border border-slate-300 rounded-xl outline-none focus:border-blue-500 text-sm bg-white" />
                    <button type="button" onClick={addPhoneMemo} className="h-10 px-4 rounded-xl bg-blue-600 text-white text-sm font-bold">추가</button>
                  </div>
                </>
              ) : <p className="text-sm text-slate-400">날짜를 눌러 일정을 보고 추가해 보세요.</p>}
            </div>
          </div>
        </div>
      );
    }

    function AuthView({ onAuth }) {
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [formData, setFormData] = useState({ loginId: safeStorage.getItem('crm_saved_id') || '', password: '', name: '', phone: '', department: '' });
      const [rememberId, setRememberId] = useState(!!safeStorage.getItem('crm_saved_id'));
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (!formData.loginId) return alert("아이디를 입력해주세요.");
        if (!formData.password) return alert("비밀번호를 입력해주세요.");
        if (!isLoginMode) {
           if (!formData.name) return alert("이름을 입력해주세요.");
           if (!formData.phone) return alert("전화번호를 입력해주세요.");
        }

        setErrorMsg('');
        setIsSubmitting(true);
        if (rememberId && isLoginMode) safeStorage.setItem('crm_saved_id', formData.loginId);
        else if (!rememberId && isLoginMode) safeStorage.removeItem('crm_saved_id');
        const result = await onAuth(isLoginMode ? 'login' : 'signup', formData);
        if (result && !result.success) setErrorMsg(result.message);
        setIsSubmitting(false);
      };

      return (
        <div className="relative flex min-h-screen w-full items-center justify-center bg-gradient-to-br from-[#3182f6] to-[#1b57c8] p-4 overflow-hidden">
          <div className="pointer-events-none absolute -top-40 -right-40 w-[480px] h-[480px] rounded-full bg-white/10 blur-3xl"></div>
          <div className="pointer-events-none absolute -bottom-48 -left-40 w-[520px] h-[520px] rounded-full bg-sky-300/20 blur-3xl"></div>
          <div className="relative w-full max-w-md bg-white p-7 sm:p-10 rounded-3xl shadow-2xl">
            <div className="flex flex-col items-center justify-center mb-8">
              <LogoMark className="w-16 h-16 mb-5" />
              <h1 className="text-[28px] font-semibold text-ink-900 tracking-tight">빌딩탭</h1>
              <p className="text-[10px] tracking-[0.35em] text-gold-600 mt-2 uppercase font-semibold">Building Tab</p>
              <p className="text-sm text-slate-500 mt-4 text-center">부동산 매물 관리의 시작</p>
            </div>

            <div className="flex p-1 bg-stone-100 rounded-3xl mb-7">
              <button type="button" onClick={() => {setIsLoginMode(true); setErrorMsg('');}} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${isLoginMode ? 'bg-white text-ink-900 shadow-sm' : 'text-slate-500 hover:text-ink-900'}`}>로그인</button>
              <button type="button" onClick={() => {setIsLoginMode(false); setErrorMsg('');}} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${!isLoginMode ? 'bg-white text-ink-900 shadow-sm' : 'text-slate-500 hover:text-ink-900'}`}>사원 가입</button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="space-y-1.5">
                <label className="text-[13px] font-semibold text-slate-600">아이디</label>
                <div className="relative">
                  <User className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input type="text" name="loginId" value={formData.loginId} onChange={handleChange} placeholder="아이디 입력" className="w-full pl-12 pr-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" />
                </div>
              </div>
              <div className="space-y-1.5">
                <label className="text-[13px] font-semibold text-slate-600">비밀번호</label>
                <div className="relative">
                  <Lock className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input type="password" name="password" value={formData.password} onChange={handleChange} placeholder="비밀번호 입력" className="w-full pl-12 pr-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" />
                </div>
              </div>
              {isLoginMode && (
                <label className="flex items-center gap-2 text-sm text-slate-500 mt-2 cursor-pointer font-medium pl-1">
                  <input type="checkbox" checked={rememberId} onChange={(e) => setRememberId(e.target.checked)} className="w-4 h-4 rounded text-ink-900 focus:ring-gold-400 border-stone-300" /> 아이디 기억하기
                </label>
              )}
              {!isLoginMode && (
                <div className="space-y-4 pt-4 border-t border-stone-100 mt-2">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="space-y-1.5"><label className="text-[13px] font-semibold text-slate-600">이름</label><input type="text" name="name" value={formData.name} onChange={handleChange} placeholder="홍길동" className="w-full px-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" /></div>
                    <div className="space-y-1.5"><label className="text-[13px] font-semibold text-slate-600">소속</label><input type="text" name="department" value={formData.department} onChange={handleChange} placeholder="영업1팀" className="w-full px-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" /></div>

                </div>

              {errorMsg && <div className="p-3 bg-red-50 text-red-600 text-sm font-semibold rounded-3xl text-center border border-red-100">{errorMsg}</div>}
              <button type="submit" disabled={isSubmitting} className={`w-full py-4 bg-ink-900 text-white font-semibold rounded-3xl hover:bg-ink-700 transition-all shadow-lg shadow-ink-900/20 mt-6 flex items-center justify-center gap-2 text-base ${isSubmitting ? 'opacity-50 cursor-not-allowed' : ''}`}>
                {isSubmitting ? '처리 중...' : (isLoginMode ? <><ShieldCheck className="w-5 h-5 text-gold-300" /> 로그인</> : '가입 완료 및 접속')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function App() {
