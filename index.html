                  {selectable && <th className={th + " w-10 text-center"}><input type="checkbox" checked={allChecked} onChange={toggleAll} title="전체 선택" className="w-4 h-4 accent-blue-600 cursor-pointer" /></th>}
                  {!shared && <th className={th}>이름</th>}{!shared && <th className={th}>전화번호</th>}
                  <th className={th}>투자금액</th><th className={th}>희망 지역</th><th className={th}>건물 유형</th><th className="p-3 md:p-4 font-medium">구매사유</th>
                  {shared && <th className={th}>등록자</th>}{shared && <th className={th}>등록일</th>}
                  {!shared && <th className={th + " text-center"}>공유</th>}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-xs md:text-sm">
                {shown.map(cust => (
                  <tr key={cust.id} onClick={() => onViewDetail && onViewDetail(cust)} className="hover:bg-blue-50/50 transition-colors align-top cursor-pointer">
                    {selectable && <td className="p-3 md:p-4 text-center" onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={checkedIds.includes(cust.id)} onChange={() => toggleOne(cust.id)} className="w-4 h-4 accent-blue-600 cursor-pointer" /></td>}
                    {!shared && <td className="p-3 md:p-4 font-bold text-ink-800 whitespace-nowrap">{cust.name}</td>}{!shared && <td className={td}>{cust.phone}</td>}
                    <td className="p-3 md:p-4 font-bold text-red-600 whitespace-nowrap">{money(cust.budget)}</td>
                    <td className={td}>{cust.region}</td>
                    <td className={td}>{cust.buildingtype || '-'}</td>
                    <td className="p-3 md:p-4 text-slate-600 whitespace-pre-line min-w-[260px]">{cust.reason}</td>
                    {shared && <td className={td}>{cust.registrant}</td>}{shared && <td className={td}>{cust.date}</td>}
                    {!shared && <td className="p-3 md:p-4 text-center"><button type="button" onClick={(e) => { e.stopPropagation(); onToggleShare && onToggleShare(cust.id); }} title="공유 매수자에 올리거나 내리기" className={`px-3 py-1 rounded-full text-xs font-bold border transition-colors ${cust.is_shared ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-300'}`}>{cust.is_shared ? '공유 중' : '비공개'}</button></td>}
                  </tr>
                ))}
                {shown.length === 0 && <tr><td colSpan={8} className="p-8 text-center text-slate-400">{shared ? '공유된 매수자가 없습니다.' : '조건에 맞는 매수자가 없습니다.'}</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ProfileModal({ user, onClose, onSave }) {
      const [form, setForm] = useState({ name: user.name || '', department: user.department || '', phone: user.phone || '' });
      const [saving, setSaving] = useState(false);

    function CalendarView({ currentUser, properties, memos, setMemos, onDbError }) {
      const [date, setDate] = useState(new Date());
      const [editingDate, setEditingDate] = useState(null);
      const [newMemo, setNewMemo] = useState('');
      const pad2 = (n) => String(n).padStart(2, '0');
      const todayObj = new Date();
      const [selectedDay, setSelectedDay] = useState(`${todayObj.getFullYear()}-${pad2(todayObj.getMonth() + 1)}-${pad2(todayObj.getDate())}`);
      const [phoneMemo, setPhoneMemo] = useState('');

      const year = date.getFullYear();
      const month = date.getMonth();

      const handleAddMemo = (e, dayStr) => { 
        e.stopPropagation(); 
        setEditingDate(dayStr); 
        setNewMemo(''); 
      };

      const saveMemo = async (e, dayStr) => { 
        e.stopPropagation(); 
        if (newMemo.trim()) {
          const newMemoObj = { id: `M-${Date.now()}`, user_id: currentUser.loginId, dateStr: dayStr, text: newMemo.trim() };
          
          setMemos(prev => [...prev, newMemoObj]);
          setEditingDate(null); 

          const { error } = await supabase.from('crm_memos').insert([newMemoObj]);
          if (error && onDbError) onDbError(error, 'crm_memos');
        }
      };

      const deleteMemo = async (e, id) => { 
        e.stopPropagation(); 
        setMemos(prev => prev.filter(m => m.id !== id)); 
        
        const { error } = await supabase.from('crm_memos').delete().eq('id', id);
        if (error && onDbError) onDbError(error, 'crm_memos');
      };

      const addPhoneMemo = async () => {
        if (!phoneMemo.trim() || !selectedDay) return;
        const memoObj = { id: `M-${Date.now()}`, user_id: currentUser.loginId, dateStr: selectedDay, text: phoneMemo.trim() };
        setMemos(prev => [...prev, memoObj]);
        setPhoneMemo('');
        const { error } = await supabase.from('crm_memos').insert([memoObj]);
        if (error && onDbError) onDbError(error, 'crm_memos');
      };

      // 폰: 칸에는 날짜와 점만 보여 주고, 눌러서 고른 날의 일정은 아래 패널에 크게 보여 준다
      const renderPhoneDays = () => {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push(<div key={`pe-${i}`} className="h-14"></div>);
        for (let d = 1; d <= daysInMonth; d++) {
          const dayStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
          const dow = new Date(year, month, d).getDay();
          const isToday = todayObj.getFullYear() === year && todayObj.getMonth() === month && todayObj.getDate() === d;
          const memoCount = memos.filter(m => m.dateStr === dayStr && m.user_id === currentUser.loginId).length;
          const doneCount = properties.filter(p => p.user_id === currentUser.loginId && p.date === dayStr && p.status === '완료').length;
          const selected = selectedDay === dayStr;
          cells.push(
            <button type="button" key={d} onClick={() => setSelectedDay(dayStr)} className={`h-14 rounded-xl flex flex-col items-center pt-1.5 gap-1 border transition-colors ${selected ? 'border-blue-500 bg-blue-50' : isToday ? 'border-blue-200 bg-blue-50/40' : 'border-slate-100 bg-white'}`}>
              <span className={`text-sm font-semibold ${dow === 0 ? 'text-red-500' : dow === 6 ? 'text-blue-500' : 'text-slate-700'} ${isToday ? 'underline' : ''}`}>{d}</span>
              <span className="flex items-center gap-0.5 h-1.5">
                {memoCount > 0 && <i className="w-1.5 h-1.5 rounded-full bg-slate-400 block"></i>}
                {memoCount > 1 && <i className="w-1.5 h-1.5 rounded-full bg-slate-300 block"></i>}
                {doneCount > 0 && <i className="w-1.5 h-1.5 rounded-full bg-blue-700 block"></i>}
              </span>
            </button>
          );
        }
        return cells;
      };

      const renderDays = () => {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const days = [];
        
        for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} onClick={() => { if (editingDate) { setEditingDate(null); setNewMemo(''); } }} className="bg-slate-50 border border-slate-100 rounded-lg"></div>);
        for (let d = 1; d <= daysInMonth; d++) {
          const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
          const currentDayOfWeek = new Date(year, month, d).getDay();
          const dayColor = currentDayOfWeek === 0 ? 'text-red-500' : currentDayOfWeek === 6 ? 'text-blue-500' : 'text-slate-700';

          const currentMemos = memos.filter(m => m.dateStr === dayStr && m.user_id === currentUser.loginId);
          const completedCount = properties.filter(p => p.user_id === currentUser.loginId && p.date === dayStr && p.status === '완료').length;

          days.push(
            <div key={d} onClick={(e) => { if (!editingDate) handleAddMemo(e, dayStr); else if (editingDate !== dayStr) { setEditingDate(null); setNewMemo(''); } }} className={`group relative min-h-[100px] md:min-h-[130px] p-1 md:p-2 border border-slate-100 rounded-lg cursor-pointer hover:border-blue-300 transition-colors ${isToday ? 'bg-blue-50/30 border-blue-200' : 'bg-white'}`}>
              <div className="flex justify-between items-start mb-1">
                <div className={`text-xs md:text-sm font-semibold ${dayColor} ${isToday ? 'font-extrabold underline' : ''}`}>{d}</div>
                <button type="button" onClick={(e) => handleAddMemo(e, dayStr)} className="w-5 h-5 rounded-full hover:bg-slate-100 text-slate-300 hover:text-blue-600 flex items-center justify-center opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-all"><Plus className="w-3 h-3" /></button>
              </div>
              
              <div className="space-y-1 flex flex-col">
                {currentMemos.map((memo) => (
                  <div key={memo.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center text-[10px] md:text-[11px] bg-blue-50 text-blue-700 pl-1.5 pr-1 py-1 rounded border border-blue-100 hover:bg-blue-100 transition-colors group/item gap-1 sm:gap-0">
                    <span className="truncate w-full sm:flex-1" title={memo.text}>{memo.text}</span>
                    <button type="button" onClick={(e) => deleteMemo(e, memo.id)} className="text-slate-400 hover:text-red-500 p-0.5 ml-auto sm:ml-1 opacity-100 md:opacity-0 md:group-hover/item:opacity-100 transition-opacity"><Trash2 className="w-3 h-3" /></button>
                  </div>
                ))}

                {completedCount > 0 && (
                  <div className="inline-flex items-center gap-1 text-[10px] md:text-[11px] font-bold bg-blue-100 text-blue-800 px-1.5 py-1 rounded border border-blue-200 mt-0.5 w-max">
                    <span className="w-1.5 h-1.5 rounded-full bg-blue-700"></span>
                    완료: {completedCount}건
                  </div>
                )}

                {editingDate === dayStr && (
                  <div className="mt-1" onClick={e => e.stopPropagation()}>
                    <input autoFocus type="text" value={newMemo} onChange={e => setNewMemo(e.target.value)} onKeyDown={e => e.key === 'Enter' && saveMemo(e, dayStr)} placeholder="일정 입력..." className="w-full text-[10px] md:text-xs p-1 md:p-1.5 border border-blue-300 rounded outline-none" />
                  </div>
                )}
              </div>
            </div>
          );
        }
        return days;
      };

      const selInMonth = selectedDay && selectedDay.startsWith(`${year}-${pad2(month + 1)}-`);
      const selMemos = selInMonth ? memos.filter(m => m.dateStr === selectedDay && m.user_id === currentUser.loginId) : [];
      const selDone = selInMonth ? properties.filter(p => p.user_id === currentUser.loginId && p.date === selectedDay && p.status === '완료').length : 0;
      const selDate = selInMonth ? new Date(selectedDay + 'T00:00:00') : null;

      return (
        <div className="bg-white p-4 md:p-6 rounded-3xl shadow h-full flex flex-col">
          <div className="flex justify-between items-center mb-4 md:mb-6 gap-2">
            <h2 className="text-lg md:text-xl font-bold whitespace-nowrap"><CalendarIcon className="w-5 h-5 md:w-6 md:h-6 inline text-blue-600 mr-2"/>개인 캘린더</h2>
            <div className="flex items-center gap-1 md:gap-4">
              <button type="button" onClick={() => setDate(new Date(year, month - 1, 1))} className="p-2 hover:bg-slate-100 rounded-full"><ChevronLeft className="w-5 h-5"/></button>
              <span className="font-bold text-base md:text-lg whitespace-nowrap">{year}년 {month + 1}월</span>
              <button type="button" onClick={() => setDate(new Date(year, month + 1, 1))} className="p-2 hover:bg-slate-100 rounded-full"><ChevronRight className="w-5 h-5"/></button>
            </div>
          </div>
          <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2 text-center font-bold text-xs md:text-sm">
            <div className="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div className="text-blue-500">토</div>
          </div>
          <div className="hidden md:grid grid-cols-7 gap-2 flex-1 overflow-y-auto">{renderDays()}</div>
          <div className="md:hidden">
            <div className="grid grid-cols-7 gap-1">{renderPhoneDays()}</div>
            <div className="mt-4 p-4 rounded-2xl bg-slate-50 border border-slate-200">
              {selDate ? (
                <>
                  <div className="flex items-center justify-between gap-2 mb-3">
                    <h3 className="font-bold text-sm text-ink-800">{month + 1}월 {selDate.getDate()}일 ({['일', '월', '화', '수', '목', '금', '토'][selDate.getDay()]})</h3>
                    {selDone > 0 && <span className="inline-flex items-center gap-1 text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded-full border border-blue-200"><span className="w-1.5 h-1.5 rounded-full bg-blue-700"></span>완료 {selDone}건</span>}
                  </div>
                  <div className="space-y-2">
                    {selMemos.length === 0 && <p className="text-sm text-slate-400">등록된 일정이 없어요.</p>}
                    {selMemos.map(memo => (
                      <div key={memo.id} className="flex items-start justify-between gap-2 bg-white border border-blue-100 rounded-xl px-3 py-2 text-sm text-blue-800">
                        <span className="break-words min-w-0">{memo.text}</span>
                        <button type="button" onClick={(e) => deleteMemo(e, memo.id)} className="text-slate-400 hover:text-red-500 p-1 shrink-0" title="삭제"><Trash2 className="w-4 h-4" /></button>
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2 mt-3">
                    <input type="text" value={phoneMemo} onChange={(e) => setPhoneMemo(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addPhoneMemo()} placeholder="일정 입력..." className="flex-1 min-w-0 h-10 px-3 border border-slate-300 rounded-xl outline-none focus:border-blue-500 text-sm bg-white" />
                    <button type="button" onClick={addPhoneMemo} className="h-10 px-4 rounded-xl bg-blue-600 text-white text-sm font-bold">추가</button>
                  </div>
                </>
              ) : <p className="text-sm text-slate-400">날짜를 눌러 일정을 보고 추가해 보세요.</p>}
            </div>
          </div>
        </div>
      );
    }

    function AuthView({ onAuth }) {
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [formData, setFormData] = useState({ loginId: safeStorage.getItem('crm_saved_id') || '', password: '', name: '', phone: '', department: '' });
      const [rememberId, setRememberId] = useState(!!safeStorage.getItem('crm_saved_id'));
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (!formData.loginId) return alert("아이디를 입력해주세요.");
        if (!formData.password) return alert("비밀번호를 입력해주세요.");
        if (!isLoginMode) {
           if (!formData.name) return alert("이름을 입력해주세요.");
           if (!formData.phone) return alert("전화번호를 입력해주세요.");
        }

        setErrorMsg('');
        setIsSubmitting(true);
        if (rememberId && isLoginMode) safeStorage.setItem('crm_saved_id', formData.loginId);
        else if (!rememberId && isLoginMode) safeStorage.removeItem('crm_saved_id');
        const result = await onAuth(isLoginMode ? 'login' : 'signup', formData);
        if (result && !result.success) setErrorMsg(result.message);
        setIsSubmitting(false);
      };

      return (
        <div className="relative flex min-h-screen w-full items-center justify-center bg-gradient-to-br from-[#3182f6] to-[#1b57c8] p-4 overflow-hidden">
          <div className="pointer-events-none absolute -top-40 -right-40 w-[480px] h-[480px] rounded-full bg-white/10 blur-3xl"></div>
          <div className="pointer-events-none absolute -bottom-48 -left-40 w-[520px] h-[520px] rounded-full bg-sky-300/20 blur-3xl"></div>
          <div className="relative w-full max-w-md bg-white p-7 sm:p-10 rounded-3xl shadow-2xl">
            <div className="flex flex-col items-center justify-center mb-8">
              <LogoMark className="w-16 h-16 mb-5" />
              <h1 className="text-[28px] font-semibold text-ink-900 tracking-tight">빌딩탭</h1>
              <p className="text-[10px] tracking-[0.35em] text-gold-600 mt-2 uppercase font-semibold">Building Tab</p>
              <p className="text-sm text-slate-500 mt-4 text-center">부동산 매물 관리의 시작</p>
            </div>

            <div className="flex p-1 bg-stone-100 rounded-3xl mb-7">
              <button type="button" onClick={() => {setIsLoginMode(true); setErrorMsg('');}} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${isLoginMode ? 'bg-white text-ink-900 shadow-sm' : 'text-slate-500 hover:text-ink-900'}`}>로그인</button>
              <button type="button" onClick={() => {setIsLoginMode(false); setErrorMsg('');}} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all ${!isLoginMode ? 'bg-white text-ink-900 shadow-sm' : 'text-slate-500 hover:text-ink-900'}`}>사원 가입</button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="space-y-1.5">
                <label className="text-[13px] font-semibold text-slate-600">아이디</label>
                <div className="relative">
                  <User className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input type="text" name="loginId" value={formData.loginId} onChange={handleChange} placeholder="아이디 입력" className="w-full pl-12 pr-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" />
                </div>
              </div>
              <div className="space-y-1.5">
                <label className="text-[13px] font-semibold text-slate-600">비밀번호</label>
                <div className="relative">
                  <Lock className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input type="password" name="password" value={formData.password} onChange={handleChange} placeholder="비밀번호 입력" className="w-full pl-12 pr-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" />
                </div>
              </div>
              {isLoginMode && (
                <label className="flex items-center gap-2 text-sm text-slate-500 mt-2 cursor-pointer font-medium pl-1">
                  <input type="checkbox" checked={rememberId} onChange={(e) => setRememberId(e.target.checked)} className="w-4 h-4 rounded text-ink-900 focus:ring-gold-400 border-stone-300" /> 아이디 기억하기
                </label>
              )}
              {!isLoginMode && (
                <div className="space-y-4 pt-4 border-t border-stone-100 mt-2">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="space-y-1.5"><label className="text-[13px] font-semibold text-slate-600">이름</label><input type="text" name="name" value={formData.name} onChange={handleChange} placeholder="홍길동" className="w-full px-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" /></div>
                    <div className="space-y-1.5"><label className="text-[13px] font-semibold text-slate-600">소속</label><input type="text" name="department" value={formData.department} onChange={handleChange} placeholder="영업1팀" className="w-full px-4 py-3.5 border border-stone-200 rounded-3xl outline-none bg-stone-50 focus:bg-white focus:border-gold-400 focus:ring-2 focus:ring-gold-400/30 transition-all" /></div>

                </div>

              {errorMsg && <div className="p-3 bg-red-50 text-red-600 text-sm font-semibold rounded-3xl text-center border border-red-100">{errorMsg}</div>}
              <button type="submit" disabled={isSubmitting} className={`w-full py-4 bg-ink-900 text-white font-semibold rounded-3xl hover:bg-ink-700 transition-all shadow-lg shadow-ink-900/20 mt-6 flex items-center justify-center gap-2 text-base ${isSubmitting ? 'opacity-50 cursor-not-allowed' : ''}`}>
                {isSubmitting ? '처리 중...' : (isLoginMode ? <><ShieldCheck className="w-5 h-5 text-gold-300" /> 로그인</> : '가입 완료 및 접속')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function App() {

      const [hasFetched, setHasFetched] = useState(false);

      const [properties, setProperties] = useState([]);
      const [employees, setEmployees] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sharedCustomers, setSharedCustomers] = useState([]);
      const [memos, setMemos] = useState([]);
      const [comments, setComments] = useState([]);

      const [currentView, setCurrentView] = useState('list'); 
      const [selectedProperty, setSelectedProperty] = useState(null);
      
      const [activeTab, setActiveTab] = useState('calendar'); 
      const [currentEmployeeView, setCurrentEmployeeView] = useState('list');
      const [currentCustomerView, setCurrentCustomerView] = useState('list');
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [showProfile, setShowProfile] = useState(false);

      const [searchTerm, setSearchTerm] = useState('');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => { try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch (e) { return false; } });
      const toggleSidebar = () => setSidebarCollapsed(v => { const n = !v; try { localStorage.setItem('sidebarCollapsed', n ? '1' : '0'); } catch (e) {} return n; });
      const [rlsError, setRlsError] = useState(false);

      const handleSupabaseError = (error, tableName) => {
        if (!error) return false;
        console.warn(`DB Warning (${tableName}):`, error.message);
        if (error.code === '42501') {
          setRlsError(true);
        } else {
          alert(`데이터베이스 오류 (${tableName}):\n${error.message}`);
        }
        return true;
      };

      const fetchCloudData = async () => {
        setIsFetchingData(true);
        try {
          const [propsRes, usersRes, custsRes, memosRes, commentsRes, sharedCustRes] = await Promise.all([
            supabase.from('crm_properties').select('*'),
            supabase.from('crm_users').select('*'),
            supabase.from('crm_customers').select('*'),
            supabase.from('crm_memos').select('*'),
            supabase.from('crm_comments').select('*'),
            supabase.from('crm_shared_customers').select('*')
          ]);
          
          if (propsRes.data) {
             const serverProps = propsRes.data.map(fromDB);
             serverProps.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
             setProperties(serverProps);
          }
          if (usersRes.data) setEmployees(usersRes.data);
          if (custsRes.data) setCustomers(custsRes.data);
          if (memosRes.data) setMemos(memosRes.data);
          if (commentsRes.data) setComments(commentsRes.data);
          if (sharedCustRes.data) setSharedCustomers(sharedCustRes.data);
          else if (sharedCustRes.error) console.warn('공유 매수자를 불러오지 못했어요:', sharedCustRes.error.message);
        } catch (err) {
          console.warn("데이터 로드 실패:", err.message);
        } finally {
          setIsFetchingData(false);
          setHasFetched(true);
        }
      };

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            setCurrentUser({
              loginId: session.user.email.replace('@crm.local', '').toLowerCase(),
              name: session.user.user_metadata?.name || '사용자',
              department: session.user.user_metadata?.department || '사원',
              phone: session.user.user_metadata?.phone || '',
              id: session.user.id
            });
            setIsAuthenticated(true);
          }
          setIsAuthLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session) {
            setCurrentUser({
              loginId: session.user.email.replace('@crm.local', '').toLowerCase(),
              name: session.user.user_metadata?.name || '사용자',
              department: session.user.user_metadata?.department || '사원',
              phone: session.user.user_metadata?.phone || '',
              id: session.user.id
            });
            setIsAuthenticated(true);
          } else {
            setCurrentUser(null);
            setIsAuthenticated(false);
          }
        });

        fetchCloudData();
        const interval = setInterval(fetchCloudData, 15000);

        return () => {
          subscription.unsubscribe();
          clearInterval(interval);
        };
      }, []);

      // 브라우저 뒤로가기/앞으로가기 버튼으로 화면(목록·상세·수정·리포트)을 오갈 수 있게 한다.
      const propsRef = useRef([]);
      propsRef.current = properties;
      const navInit = useRef(false);
      const custRef = useRef([]);
      custRef.current = [...customers, ...sharedCustomers];
      useEffect(() => {
        const st = { tab: activeTab, view: currentView, emp: currentEmployeeView, cust: currentCustomerView, sel: selectedProperty ? selectedProperty.id : null, selc: selectedCustomer ? selectedCustomer.id : null };
        const cur = window.history.state;
        if (!navInit.current) { navInit.current = true; try { window.history.replaceState(st, ''); } catch (e) {} return; }
        if (!cur || cur.tab !== st.tab || cur.view !== st.view || cur.emp !== st.emp || cur.cust !== st.cust || cur.sel !== st.sel || cur.selc !== st.selc) {
          try { window.history.pushState(st, ''); } catch (e) {}
        }
      }, [activeTab, currentView, currentEmployeeView, currentCustomerView, selectedProperty ? selectedProperty.id : null, selectedCustomer ? selectedCustomer.id : null]);
      useEffect(() => {
        const onPop = (e) => {
          const st = e.state;
          if (!st) return;
          const found = st.sel ? propsRef.current.find(p => p.id === st.sel) : null;
          const needsProperty = (st.tab === 'properties' || st.tab === 'shared') && st.view !== 'list' && !(st.view === 'form' && !st.sel);
          setActiveTab(st.tab);
          setCurrentEmployeeView(st.emp || 'list');
          const foundCust = st.selc ? custRef.current.find(c => c.id === st.selc) : null;
          setSelectedCustomer(foundCust || null);
          setCurrentCustomerView((st.cust === 'detail' || st.cust === 'edit') && !foundCust ? 'list' : (st.cust || 'list'));
          setSelectedProperty(found || null);
          setCurrentView(needsProperty && !found ? 'list' : st.view);
        };
        window.addEventListener('popstate', onPop);
        return () => window.removeEventListener('popstate', onPop);
      }, []);

      const myProperties = useMemo(() => {
        if (!currentUser || !properties) return [];
        return properties.filter(p => p.user_id && p.user_id.toLowerCase() === currentUser.loginId.toLowerCase());
      }, [properties, currentUser]);

      const filteredMyProperties = useMemo(() => {
        return myProperties.filter(p => 
          (p.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
          (p.address || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [myProperties, searchTerm]);

      const filteredSharedProperties = useMemo(() => {
        const q = searchTerm.toLowerCase();
        return properties.filter(p => p.is_shared === true).filter(p =>
          (p.name || '').toLowerCase().includes(q) || (p.address || '').toLowerCase().includes(q)
        );
      }, [properties, searchTerm]);

      // 공유 물건·공유 매수자에 새로 올라온 것 알림 (이 컴퓨터에서 마지막으로 열어 본 뒤 올라온 것만 센다)
      const [seenShared, setSeenShared] = useState({ props: null, custs: null });
      const sharedPropIds = useMemo(() => properties.filter(p => p.is_shared === true && !(currentUser && p.user_id && p.user_id.toLowerCase() === currentUser.loginId.toLowerCase())).map(p => p.id), [properties, currentUser]);
      const sharedCustIds = useMemo(() => { const mine = new Set(customers.map(c => c.id)); return sharedCustomers.filter(c => !mine.has(c.id)).map(c => c.id); }, [sharedCustomers, customers]);
      const seenKey = currentUser ? 'crm_seen_' + currentUser.loginId : null;
      useEffect(() => {
        if (!seenKey) return;
        try { const r = JSON.parse(localStorage.getItem(seenKey) || 'null'); setSeenShared(r && r.props && r.custs ? r : { props: null, custs: null }); } catch (e) { setSeenShared({ props: null, custs: null }); }
      }, [seenKey]);
      useEffect(() => {
        if (!seenKey || !hasFetched) return;
        setSeenShared(prev => {
          const next = { ...prev };
          if (prev.props === null || activeTab === 'shared') next.props = sharedPropIds;
          if (prev.custs === null || activeTab === 'sharedCustomers') next.custs = sharedCustIds;
          if (next.props === prev.props && next.custs === prev.custs) return prev;
          try { localStorage.setItem(seenKey, JSON.stringify(next)); } catch (e) {}
          return next;
        });
      }, [activeTab, sharedPropIds, sharedCustIds, hasFetched, seenKey]);
      const unreadProps = seenShared.props ? sharedPropIds.filter(id => !seenShared.props.includes(id)).length : 0;
      const unreadCusts = seenShared.custs ? sharedCustIds.filter(id => !seenShared.custs.includes(id)).length : 0;

      const filteredEmployees = useMemo(() => {
        return employees.filter(e =>
          currentUser && e.id !== currentUser.id &&
          ((e.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.department || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.loginId || '').toLowerCase().includes(searchTerm.toLowerCase()))
        );
      }, [employees, currentUser, searchTerm]);

      const filteredSharedCustomers = useMemo(() => {
        const q = searchTerm.toLowerCase();
        return sharedCustomers.filter(c => !q || (c.region || '').toLowerCase().includes(q) || (c.reason || '').toLowerCase().includes(q) || (c.registrant || '').toLowerCase().includes(q));
      }, [sharedCustomers, searchTerm]);

      const filteredCustomers = useMemo(() => {
        return customers.filter(c =>
          (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (c.region || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [customers, searchTerm]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (isMobileMenuOpen && e.target.closest('#sidebar-overlay')) setIsMobileMenuOpen(false);
        };
        document.addEventListener('click', handleClickOutside);
        return () => document.removeEventListener('click', handleClickOutside);
      }, [isMobileMenuOpen]);

      const handleAuth = async (type, data) => {
        const safeId = data.loginId.toLowerCase().trim();
        const email = safeId.includes('@') ? safeId : `${safeId}@crm.local`;

        if (type === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password: data.password });
          if (error) return { success: false, message: '아이디 또는 비밀번호가 일치하지 않습니다.' };
          setActiveTab('calendar');
          return { success: true };
        } 
        
        if (type === 'signup') {
          const { data: authData, error } = await supabase.auth.signUp({
            email, password: data.password,
            options: { data: { name: data.name, department: data.department || '신규 사원', phone: data.phone } }
          });

          if (error) {
            if (error.message.includes('already registered')) return { success: false, message: '이미 존재하는 아이디입니다.' };
            return { success: false, message: error.message };
          }

          if (authData.user) {
             const empData = {
               id: authData.user.id, loginId: data.loginId.toLowerCase(), name: data.name,
               department: data.department || '신규 사원', phone: data.phone, date: new Date().toISOString().split('T')[0]
             };
             const { error: dbErr } = await supabase.from('crm_users').insert([empData]);
             if (handleSupabaseError(dbErr, 'crm_users')) return { success: false, message: 'DB 보안 정책에 의해 등록 차단됨' };
          }

          setActiveTab('calendar');
          return { success: true };
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setIsMobileMenuOpen(false);
      };

      const handleSaveProperty = async (prop) => {
        try {
          const existing = properties.find(p => p.id === prop.id);
          const finalProp = { 
            ...prop, 
            ...(existing && existing.is_shared !== undefined && prop.is_shared === undefined ? { is_shared: existing.is_shared } : {}),
            id: prop.id || `P-${Date.now()}`,
            user_id: prop.user_id || currentUser?.loginId?.toLowerCase() || 'unknown', 
            registrant: prop.registrant || currentUser?.name || '등록자',
            registrantPhone: prop.registrantPhone || currentUser?.phone || '',
            date: prop.date || new Date().toISOString().split('T')[0]
          };
          
          setProperties(prev => {
            const idx = prev.findIndex(p => p.id === finalProp.id);
            if(idx >= 0) { const newList = [...prev]; newList[idx] = finalProp; return newList; }
            return [finalProp, ...prev]; 
          });

          setCurrentView('list');
          setSelectedProperty(null);
          
          const scrollArea = document.getElementById('main-scroll-area');
          if (scrollArea) scrollArea.scrollTo({ top: 0, behavior: 'auto' });
          window.scrollTo({ top: 0, behavior: 'auto' });

          let { error } = await supabase.from('crm_properties').upsert(toDB(finalProp));
          if (error && /is_shared/.test(error.message || '')) {
            const { is_shared, ...rest } = finalProp;
            ({ error } = await supabase.from('crm_properties').upsert(toDB(rest)));
            if (!error) {
              setProperties(prev => prev.map(p => p.id === finalProp.id ? { ...p, is_shared: false } : p));
              alert('물건은 저장되었어요. 다만 공유 물건 설정은 Supabase에 공유용 SQL을 먼저 실행해야 쓸 수 있습니다.');
            }
          }
          handleSupabaseError(error, 'crm_properties');
          
        } catch (err) {
          alert(`시스템 오류가 발생했습니다:\n${err.message}`);
        }
      };

      const handleUpdateProperty = async (prop) => {
        try {
          setProperties(prev => prev.map(p => p.id === prop.id ? prop : p));
          setSelectedProperty(prop);

          const { error } = await supabase.from('crm_properties').upsert(toDB(prop));
          handleSupabaseError(error, 'crm_properties');
        } catch (err) {
          alert(`시스템 오류가 발생했습니다:\n${err.message}`);
        }
      };

      const handleDeleteProperty = async (propertyId) => {
        setProperties(prev => prev.filter(p => p.id !== propertyId));
        setCurrentView('list');
        setSelectedProperty(null);

        const { error } = await supabase.from('crm_properties').delete().eq('id', propertyId);
        handleSupabaseError(error, 'crm_properties');
      };

      const SHARE_SQL_HINT = '공유 기능을 쓰려면 Supabase에 공유용 설정(SQL)을 먼저 한 번 실행해야 합니다.';

      const handleToggleShare = async (prop) => {
        const next = { ...prop, is_shared: !prop.is_shared };
        setProperties(prev => prev.map(p => p.id === prop.id ? next : p));
        setSelectedProperty(next);
        const { error } = await supabase.from('crm_properties').update({ is_shared: next.is_shared }).eq('id', prop.id);
        if (error) {
          setProperties(prev => prev.map(p => p.id === prop.id ? prop : p));
          setSelectedProperty(prop);
          if (error.code === '42501') handleSupabaseError(error, 'crm_properties');
          else alert(SHARE_SQL_HINT + '\n\n(원인: ' + error.message + ')');
        }
      };

      const handleAddComment = async (propertyId, content) => {
        const c = {
          id: `CM-${Date.now()}`, property_id: propertyId, user_id: currentUser.loginId, author: currentUser.name,
          content, date: new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
        };
        setComments(prev => [c, ...prev]);
        const { error } = await supabase.from('crm_comments').insert([c]);
        if (error) {
          setComments(prev => prev.filter(x => x.id !== c.id));
          if (error.code === '42501') handleSupabaseError(error, 'crm_comments');
          else alert(SHARE_SQL_HINT + '\n\n(원인: ' + error.message + ')');
        }
      };

      const handleSaveCustomer = async (newCust) => {
        const cust = { ...newCust, id: `C-${Date.now()}`, date: new Date().toISOString().split('T')[0], user_id: currentUser.loginId, registrant: currentUser.name, registrantphone: currentUser.phone || '' };
        setCustomers(prev => [cust, ...prev]);
        if (cust.is_shared) setSharedCustomers(prev => [{ id: cust.id, budget: cust.budget, region: cust.region, buildingtype: cust.buildingtype, reason: cust.reason, registrant: cust.registrant, registrantphone: cust.registrantphone, date: cust.date }, ...prev]);
        setCurrentCustomerView('list');
        const { error } = await supabase.from('crm_customers').insert([cust]);
        if (error) {
          setCustomers(prev => prev.filter(x => x.id !== cust.id));
          setSharedCustomers(prev => prev.filter(x => x.id !== cust.id));
          if (error.code === '42501') handleSupabaseError(error, 'crm_customers');
          else alert('매수자를 저장하지 못했어요. Supabase에서 supabase/customers.sql 내용을 실행했는지 확인해 주세요.\n\n(원인: ' + error.message + ')');
        }
      };

      const handleUpdateCustomer = async (id, data) => {
        const old = customers.find(x => x.id === id);
        if (!old) return;
        const upd = { ...old, ...data };
        const sc = { id, budget: upd.budget, region: upd.region, buildingtype: upd.buildingtype, reason: upd.reason, registrant: upd.registrant, registrantphone: upd.registrantphone, date: upd.date };
        setCustomers(prev => prev.map(x => x.id === id ? upd : x));
        setSharedCustomers(prev => upd.is_shared ? (prev.some(x => x.id === id) ? prev.map(x => x.id === id ? sc : x) : [sc, ...prev]) : prev.filter(x => x.id !== id));
        setSelectedCustomer(upd);
        setCurrentCustomerView('detail');
        const { error } = await supabase.from('crm_customers').update({ name: upd.name, phone: upd.phone, budget: upd.budget, region: upd.region, buildingtype: upd.buildingtype || '', reason: upd.reason, is_shared: upd.is_shared }).eq('id', id);
        if (error) { alert('수정한 내용을 저장하지 못했어요.\n\n(원인: ' + error.message + ')'); fetchCloudData(); }
      };

      const handleSaveProfile = async (info) => {
        const me = currentUser;
        setCurrentUser(prev => ({ ...prev, ...info }));
        const { error: authErr } = await supabase.auth.updateUser({ data: { name: info.name, department: info.department, phone: info.phone } });
        if (authErr) { alert('내 정보를 저장하지 못했어요.\n\n(원인: ' + authErr.message + ')'); return; }
        // 직원 목록, 내가 올린 매수자·물건의 담당자 이름/전화번호도 같이 바꾼다 (일부가 안 바뀌어도 내 정보 저장은 유지)
        const warn = (label, e) => { if (e) console.warn(label + ' 갱신 실패:', e.message); };
        const r1 = await supabase.from('crm_users').update({ name: info.name, department: info.department, phone: info.phone }).eq('id', me.id); warn('직원 목록', r1.error);
        setEmployees(prev => prev.map(e => e.id === me.id ? { ...e, name: info.name, department: info.department, phone: info.phone } : e));
        const r2 = await supabase.from('crm_customers').update({ registrant: info.name, registrantphone: info.phone }).eq('user_id', me.loginId); warn('내 매수자', r2.error);
        setCustomers(prev => prev.map(c => c.user_id && c.user_id.toLowerCase() === me.loginId.toLowerCase() ? { ...c, registrant: info.name, registrantphone: info.phone } : c));
        const mine = new Set(customers.map(c => c.id));
        setSharedCustomers(prev => prev.map(c => mine.has(c.id) ? { ...c, registrant: info.name, registrantphone: info.phone } : c));
        const r3 = await supabase.from('crm_properties').update({ registrant: info.name, registrantphone: info.phone }).eq('user_id', me.loginId); warn('내 물건', r3.error);
        setProperties(prev => prev.map(p => p.user_id && p.user_id.toLowerCase() === me.loginId.toLowerCase() ? { ...p, registrant: info.name, registrantphone: info.phone } : p));
      };

      const handleBulkDeleteCustomers = async (ids) => {
        setCustomers(prev => prev.filter(x => !ids.includes(x.id)));
        setSharedCustomers(prev => prev.filter(x => !ids.includes(x.id)));
        const { error } = await supabase.from('crm_customers').delete().in('id', ids);
        if (error) { alert('삭제하지 못했어요.\n\n(원인: ' + error.message + ')'); fetchCloudData(); }
      };

      const handleDeleteCustomer = async (id) => {
        if (!confirm('이 매수자를 삭제할까요? 되돌릴 수 없어요.')) return;
        setCustomers(prev => prev.filter(x => x.id !== id));
        setSharedCustomers(prev => prev.filter(x => x.id !== id));
        setSelectedCustomer(null);
        setCurrentCustomerView('list');
        const { error } = await supabase.from('crm_customers').delete().eq('id', id);
        if (error) { alert('삭제하지 못했어요.\n\n(원인: ' + error.message + ')'); fetchCloudData(); }
      };

      const handleToggleCustomerShare = async (id) => {
        const cust = customers.find(x => x.id === id);
        if (!cust) return;
        const next = !cust.is_shared;
        setCustomers(prev => prev.map(x => x.id === id ? { ...x, is_shared: next } : x));
        setSharedCustomers(prev => next ? [{ id: cust.id, budget: cust.budget, region: cust.region, buildingtype: cust.buildingtype, reason: cust.reason, registrant: cust.registrant, registrantphone: cust.registrantphone, date: cust.date }, ...prev.filter(x => x.id !== id)] : prev.filter(x => x.id !== id));
        const { error } = await supabase.from('crm_customers').update({ is_shared: next }).eq('id', id);
        if (error) {
          setCustomers(prev => prev.map(x => x.id === id ? { ...x, is_shared: !next } : x));
          setSharedCustomers(prev => !next ? [{ id: cust.id, budget: cust.budget, region: cust.region, buildingtype: cust.buildingtype, reason: cust.reason, registrant: cust.registrant, registrantphone: cust.registrantphone, date: cust.date }, ...prev.filter(x => x.id !== id)] : prev.filter(x => x.id !== id));
          alert('공유 설정을 바꾸지 못했어요.\n\n(원인: ' + error.message + ')');
        }
      };

      const handleDeleteComment = async (id) => {
        const old = comments.find(x => x.id === id);
        setComments(prev => prev.filter(x => x.id !== id));
        const { data, error } = await supabase.from('crm_comments').delete().eq('id', id).select();
        if (error || !data || data.length === 0) {
          if (old) setComments(prev => [old, ...prev]);
          alert('코멘트를 삭제하지 못했어요. 처음 한 번 Supabase에서 supabase/comment-delete.sql 내용을 실행해야 해요.' + (error ? '\n\n(원인: ' + error.message + ')' : ''));
        }
      };

      const handleBulkDelete = async (ids) => {
        setProperties(prev => prev.filter(p => !ids.includes(p.id)));
        const { error } = await supabase.from('crm_properties').delete().in('id', ids);
        handleSupabaseError(error, 'crm_properties');
      };

      const changeTab = (tab) => {
        setActiveTab(tab); setSearchTerm(''); setIsMobileMenuOpen(false); 
      };

      if (isAuthLoading) {
        return <div className="flex h-screen items-center justify-center text-slate-500 font-bold bg-slate-50"><i className="fas fa-spinner fa-spin mr-2"></i> 시스템 인증 정보를 확인 중입니다...</div>;
      }

      if (!isAuthenticated) return <AuthView onAuth={handleAuth} />;

      return (
        <div className="flex flex-col md:flex-row min-h-screen md:h-screen bg-ivory font-sans text-ink-800">
          <div className="md:hidden flex items-center justify-between bg-white text-ink-900 px-5 py-4 z-30 shadow-md border-b border-gold-400/20">
            <div className="flex items-center gap-2">
              <LogoMark className="w-7 h-7" />
              <h1 className="text-lg font-semibold tracking-wide">빌딩탭</h1>
            </div>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="hidden p-2 -mr-2 text-slate-300 hover:text-white transition-colors">
              <Bars className="w-6 h-6" />
            </button>
          </div>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-stone-200 flex pb-[env(safe-area-inset-bottom)]">
            {[['calendar', '캘린더', 'calendar'], ['properties', '내 물건', 'building2'], ['shared', '공유 물건', 'share'], ['sharedCustomers', '공유 매수자', 'usersround'], ['customers', '고객', 'users']].map(([k, label, ic]) => (
              <button key={k} onClick={() => { changeTab(k); if (k === 'properties' || k === 'shared') { setCurrentView('list'); setSelectedProperty(null); } if (k === 'customers' || k === 'sharedCustomers') { setCurrentCustomerView('list'); setSelectedCustomer(null); } }} className={`flex-1 min-w-0 flex flex-col items-center gap-1 pt-2.5 pb-2 text-[10px] font-semibold whitespace-nowrap ${activeTab === k ? 'text-gold-400' : 'text-slate-400'}`}>
                <span className="relative"><SvgIcon k={ic} className="w-6 h-6" />{k === 'shared' && unreadProps > 0 && <span className="absolute -top-1.5 -right-3 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">{unreadProps > 99 ? '99+' : unreadProps}</span>}{k === 'sharedCustomers' && unreadCusts > 0 && <span className="absolute -top-1.5 -right-3 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">{unreadCusts > 99 ? '99+' : unreadCusts}</span>}</span>{label}
              </button>
            ))}
            <button onClick={() => setIsMobileMenuOpen(true)} className={`flex-1 min-w-0 flex flex-col items-center gap-1 pt-2.5 pb-2 text-[10px] font-semibold ${activeTab === 'employees' ? 'text-gold-400' : 'text-slate-400'}`}>
              <SvgIcon k="usercircle" className="w-6 h-6" />더보기
            </button>
          </nav>
          {showProfile && currentUser && <ProfileModal user={currentUser} onClose={() => setShowProfile(false)} onSave={handleSaveProfile} />}
          {isMobileMenuOpen && <div id="sidebar-overlay" className="md:hidden fixed inset-0 bg-black/50 z-40"></div>}

          <aside className={`${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 fixed md:static md:relative inset-y-0 left-0 z-50 w-64 ${sidebarCollapsed ? 'md:w-[76px]' : 'md:w-64'} bg-white text-ink-800 border-r border-stone-100 flex flex-col md:shadow-none transition-transform md:transition-[width] duration-300 ease-in-out no-print`}>
            <button type="button" onClick={toggleSidebar} title={sidebarCollapsed ? '메뉴 펼치기' : '메뉴 접기'} className="hidden md:flex absolute -right-3 top-10 w-6 h-6 rounded-full bg-white text-ink-900 border border-stone-300 shadow items-center justify-center text-sm font-bold leading-none z-50 hover:bg-gold-50">{sidebarCollapsed ? '›' : '‹'}</button>
            <div className={`${sidebarCollapsed ? 'md:px-0 md:flex md:justify-center' : ''} px-7 pt-9 pb-2 hidden md:block`}>
              <div className="flex items-center gap-3.5">
                <LogoMark className="w-11 h-11 shrink-0" />
                <div className={sidebarCollapsed ? 'md:hidden' : ''}>
                  <h1 className="text-xl font-semibold tracking-wide leading-none">빌딩탭</h1>
                  <p className="text-[10px] tracking-[0.3em] text-gold-300/80 mt-2 uppercase">Building Tab</p>
                </div>
              </div>
              <div className={`${sidebarCollapsed ? "md:hidden" : ""} mt-8 h-px bg-gradient-to-r from-stone-300 via-stone-200 to-transparent`}></div>
            </div>

            <nav className={`flex-1 px-4 ${sidebarCollapsed ? "md:px-3" : ""} py-6 space-y-1.5 overflow-y-auto`}>
              <p className={`${sidebarCollapsed ? "md:hidden" : ""} px-5 pb-2 text-[10px] tracking-[0.25em] text-slate-500 uppercase`}>Menu</p>
              <SidebarItem icon={<CalendarIcon />} label="개인 캘린더" active={activeTab === 'calendar'} onClick={() => changeTab('calendar')} collapsed={sidebarCollapsed} />
              <SidebarItem icon={<Building2 />} label="내 물건 관리" active={activeTab === 'properties'} onClick={() => { changeTab('properties'); setCurrentView('list'); }} collapsed={sidebarCollapsed} />
              <SidebarItem icon={<ShareIcon />} label="공유 물건" badge={unreadProps} active={activeTab === 'shared'} onClick={() => { changeTab('shared'); setCurrentView('list'); setSelectedProperty(null); }} collapsed={sidebarCollapsed} />
              <SidebarItem icon={<UserFriends />} label="공유 매수자" badge={unreadCusts} active={activeTab === 'sharedCustomers'} onClick={() => { changeTab('sharedCustomers'); setCurrentCustomerView('list'); setSelectedCustomer(null); }} collapsed={sidebarCollapsed} />
              <SidebarItem icon={<Users />} label="고객 관리(매수자)" active={activeTab === 'customers'} onClick={() => { changeTab('customers'); setCurrentCustomerView('list'); setSelectedCustomer(null); }} collapsed={sidebarCollapsed} />
              <SidebarItem icon={<UserCircle />} label="사원 목록" active={activeTab === 'employees'} onClick={() => { changeTab('employees'); setCurrentEmployeeView('list'); }} collapsed={sidebarCollapsed} />

              <div className="pt-5 mt-5 border-t border-stone-200">
                <SidebarItem icon={<LogOutIcon />} label="로그아웃" active={false} onClick={handleLogout} collapsed={sidebarCollapsed} />
              </div>
            </nav>

            <div role="button" tabIndex={0} onClick={() => { setShowProfile(true); setIsMobileMenuOpen(false); }} onKeyDown={(e) => { if (e.key === 'Enter') { setShowProfile(true); setIsMobileMenuOpen(false); } }} title="내 정보 보기·고치기" className={`m-4 p-4 ${sidebarCollapsed ? "md:m-2 md:p-2" : ""} rounded-3xl bg-white border border-stone-200 cursor-pointer hover:bg-slate-50 transition-colors`}>
              <div className={`flex items-center gap-3 ${sidebarCollapsed ? "md:justify-center md:gap-0" : ""}`}>
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gold-300 to-gold-500 text-ink-900 flex items-center justify-center font-bold shrink-0">
                  {currentUser ? currentUser.name.charAt(0) : 'U'}
                </div>
                <div className={`truncate ${sidebarCollapsed ? "md:hidden" : ""}`}>
                  <p className="text-sm font-semibold truncate">{currentUser ? currentUser.name : '사용자'} 님</p>
                  <p className="text-xs text-slate-400 truncate mt-0.5">{currentUser ? currentUser.department : '사원'}{currentUser && !currentUser.phone ? ' · 전화번호 없음' : ''}</p>
                </div>
              </div>
            </div>
          </aside>

          <main className="flex-1 flex flex-col h-auto md:h-screen md:overflow-hidden w-full relative">
            {rlsError && (
              <div className="bg-red-600 text-white p-4 sm:p-6 text-sm font-bold flex flex-col gap-2 relative shadow-lg z-[100] w-full shrink-0 no-print">
                <h3 className="text-base sm:text-lg flex items-center gap-2"><i className="fas fa-exclamation-triangle"></i> 데이터베이스 보안 정책(RLS) 차단 알림</h3>
                <p className="font-medium text-xs sm:text-sm text-red-100">현재 데이터베이스 설정 문제로 서버 저장이 차단되었습니다. 등록한 내용은 임시로 화면에 남겨두지만, <strong>새로고침 시 사라집니다.</strong></p>
                <div className="bg-red-900/50 p-2 sm:p-3 rounded text-xs font-mono mt-1 overflow-x-auto whitespace-nowrap">
                  <span className="text-red-200">▶ 해결 방법: Supabase 대시보드 - SQL Editor에서 아래 명령어를 실행하여 잠금을 해제하세요.</span><br/><br/>
                  ALTER TABLE public.crm_properties DISABLE ROW LEVEL SECURITY;<br/>
                  ALTER TABLE public.crm_customers DISABLE ROW LEVEL SECURITY;<br/>
                  ALTER TABLE public.crm_memos DISABLE ROW LEVEL SECURITY;<br/>
                  ALTER TABLE public.crm_users DISABLE ROW LEVEL SECURITY;
                </div>
                <button onClick={() => setRlsError(false)} className="absolute top-3 right-3 p-1.5 sm:p-2 bg-red-700/50 rounded-lg hover:bg-red-700 text-white transition-colors"><i className="fas fa-times"></i></button>
              </div>
            )}
            
            <header className="bg-white/80 backdrop-blur border-b border-stone-200 flex flex-col sm:flex-row items-start sm:items-center justify-between px-5 py-4 md:px-10 gap-4 z-10 shrink-0 no-print">
              <div>
                <p className="text-[10px] tracking-[0.3em] text-gold-600 uppercase font-semibold mb-1">
                  {(activeTab === 'properties' || activeTab === 'shared') && currentView === 'report' ? 'Report' : activeTab === 'properties' ? 'Portfolio' : activeTab === 'shared' ? 'Shared' : activeTab === 'employees' ? 'Team' : activeTab === 'customers' ? 'Clients' : activeTab === 'sharedCustomers' ? 'Shared Clients' : 'Schedule'}
                </p>
                <h2 className="text-xl md:text-2xl font-semibold tracking-tight text-ink-900 flex items-center gap-2">
                  {(activeTab === 'properties' || activeTab === 'shared') && currentView === 'report' ? '프리미엄 컨설팅 리포트 출력' : 
                   activeTab === 'properties' ? '내 물건 관리' : 
                   activeTab === 'shared' ? '공유 물건' : 
                   activeTab === 'employees' ? '사원 목록' :
                   activeTab === 'customers' ? '고객 관리(매수자)' :
                   activeTab === 'sharedCustomers' ? '공유 매수자' :
                   activeTab === 'calendar' ? '개인 캘린더' : '관리 메뉴'}
                   <button onClick={fetchCloudData} className={`ml-1 p-2 rounded-full text-slate-400 hover:text-gold-600 hover:bg-gold-50 transition-colors ${isFetchingData ? 'animate-spin opacity-50' : ''}`} title="최신 데이터 불러오기">
                     <Sync className="w-4 h-4" />
                   </button>
                </h2>
              </div>
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full sm:w-auto">
                <div className="relative w-full sm:w-auto">
                  <Search className="w-4 h-4 absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400" />
                  <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="목록 빠른 검색..." className="w-full sm:w-56 md:w-72 pl-10 pr-4 py-2.5 border border-stone-200 rounded-3xl text-sm focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-400 bg-white transition-all placeholder-slate-400" />
                </div>

                {activeTab === 'properties' && currentView === 'list' && (
                  <button className="bg-gold-400 hover:bg-gold-300 text-ink-900 px-5 py-2.5 sm:py-2.5 rounded-3xl text-sm font-bold transition-colors flex items-center justify-center gap-2 whitespace-nowrap shadow-sm w-full sm:w-auto" onClick={() => { setSelectedProperty(null); setCurrentView('form'); }}>
                    <Plus className="w-4 h-4" /> 신규 등록
                  </button>
                )}
                {activeTab === 'employees' && currentEmployeeView === 'list' && (
                  <button className="bg-gold-400 hover:bg-gold-300 text-ink-900 px-5 py-2.5 sm:py-2.5 rounded-3xl text-sm font-bold transition-colors flex items-center justify-center gap-2 whitespace-nowrap shadow-sm w-full sm:w-auto" onClick={() => setCurrentEmployeeView('form')}>
                    <Plus className="w-4 h-4" /> 사원 추가
                  </button>
                )}
                {activeTab === 'customers' && currentCustomerView === 'list' && (
                  <button className="bg-gold-400 hover:bg-gold-300 text-ink-900 px-5 py-2.5 sm:py-2.5 rounded-3xl text-sm font-bold transition-colors flex items-center justify-center gap-2 whitespace-nowrap shadow-sm w-full sm:w-auto" onClick={() => setCurrentCustomerView('form')}>
                    <Plus className="w-4 h-4" /> 손님 등록
                  </button>
                )}
              </div>
            </header>

            <div id="main-scroll-area" className="flex-1 md:overflow-y-auto overflow-x-hidden p-4 md:px-10 md:py-8 relative bg-ivory print-wrapper pb-24 md:pb-8">
              {activeTab === 'properties' && (
                <>
                  {currentView === 'list' && <PropertyListView properties={filteredMyProperties} selectable onBulkDelete={handleBulkDelete} onViewDetail={(p) => { setSelectedProperty(p); setCurrentView('detail'); }} />}
                  {currentView === 'detail' && (
                    <PropertyDetailView 
                      property={selectedProperty} 
                      onBack={() => { setCurrentView('list'); setSelectedProperty(null); }} 
                      onEdit={() => setCurrentView('form')} 
                      onDelete={handleDeleteProperty} 
                      onReport={() => setCurrentView('report')} 
                      currentUser={currentUser}
                      onUpdate={handleUpdateProperty}
                      onToggleShare={handleToggleShare}
                      comments={comments.filter(c => selectedProperty && c.property_id === selectedProperty.id)}
                      onAddComment={handleAddComment}
                      onDeleteComment={handleDeleteComment}
                    />
                  )}
                  {currentView === 'report' && (
                    <PropertyReportView 
                      property={selectedProperty} 
                      onBack={() => setCurrentView('detail')} 
                      currentUser={currentUser}
                    />
                  )}
                  {currentView === 'form' && (
                    <PropertyFormView 
                      initialData={selectedProperty} 
                      onBack={() => { currentView === 'form' && selectedProperty ? setCurrentView('detail') : setCurrentView('list'); }} 
                      onSave={handleSaveProperty} 
                      currentUser={currentUser}
                    />
                  )}
                </>
              )}
              {activeTab === 'shared' && (
                <>
                  {currentView === 'list' && <PropertyListView properties={filteredSharedProperties} showRegistrant onViewDetail={(p) => { setSelectedProperty(p); setCurrentView('detail'); }} />}
                  {currentView === 'detail' && (
                    <PropertyDetailView
                      property={selectedProperty}
                      readOnly
                      onBack={() => { setCurrentView('list'); setSelectedProperty(null); }}
                      onReport={() => setCurrentView('report')}
                      currentUser={currentUser}
                      comments={comments.filter(c => selectedProperty && c.property_id === selectedProperty.id)}
                      onAddComment={handleAddComment}
                      onDeleteComment={handleDeleteComment}
                    />
                  )}
                  {currentView === 'report' && (
                    <PropertyReportView property={selectedProperty} onBack={() => setCurrentView('detail')} currentUser={currentUser} />
                  )}
                </>
              )}
              {activeTab === 'employees' && (
                <>
                  {currentEmployeeView === 'list' && <EmployeeListView employees={filteredEmployees} />}
                  {currentEmployeeView === 'form' && (
                    <EmployeeFormView 
                      onBack={() => setCurrentEmployeeView('list')} 
                      onSave={async (newEmp) => {
                        const email = newEmp.loginId.includes('@') ? newEmp.loginId : `${newEmp.loginId}@crm.local`;
                        const { data: authData, error } = await supabase.auth.signUp({
                          email, password: newEmp.password, options: { data: { name: newEmp.name, department: newEmp.department, phone: newEmp.phone } }
                        });
                        if (error) return alert(error.message);
                        
                        const emp = { ...newEmp, id: authData.user.id, date: new Date().toISOString().split('T')[0] };
                        
                        setEmployees(prev => [emp, ...prev]);
                        setCurrentEmployeeView('list');

                        const { error: dbErr } = await supabase.from('crm_users').insert([emp]);
                        handleSupabaseError(dbErr, 'crm_users');
                      }} 
                    />
                  )}
                </>
              )}
              {activeTab === 'customers' && (
                <>
                  {currentCustomerView === 'list' && <CustomerListView customers={filteredCustomers} selectable onBulkDelete={handleBulkDeleteCustomers} onToggleShare={handleToggleCustomerShare} onViewDetail={(c) => { setSelectedCustomer(c); setCurrentCustomerView('detail'); }} />}
                  {currentCustomerView === 'form' && <CustomerFormView onBack={() => setCurrentCustomerView('list')} onSave={handleSaveCustomer} />}
                  {currentCustomerView === 'detail' && selectedCustomer && (
                    <CustomerDetailView customer={customers.find(x => x.id === selectedCustomer.id) || selectedCustomer} onBack={() => { setCurrentCustomerView('list'); setSelectedCustomer(null); }} onEdit={() => setCurrentCustomerView('edit')} onDelete={() => handleDeleteCustomer(selectedCustomer.id)} onToggleShare={handleToggleCustomerShare} />
                  )}
                  {currentCustomerView === 'edit' && selectedCustomer && (
                    <CustomerFormView key={selectedCustomer.id} initialData={customers.find(x => x.id === selectedCustomer.id) || selectedCustomer} onBack={() => setCurrentCustomerView('detail')} onSave={(data) => handleUpdateCustomer(selectedCustomer.id, data)} />
                  )}
                </>
              )}
              {activeTab === 'sharedCustomers' && (
                <>
                  {currentCustomerView !== 'detail' && <CustomerListView customers={filteredSharedCustomers} shared onViewDetail={(c) => { setSelectedCustomer(c); setCurrentCustomerView('detail'); }} />}
                  {currentCustomerView === 'detail' && selectedCustomer && (
                    <CustomerDetailView shared customer={sharedCustomers.find(x => x.id === selectedCustomer.id) || selectedCustomer} registrantPhone={selectedCustomer.registrantphone || (employees.find(e => e.name === selectedCustomer.registrant) || {}).phone || ''} onBack={() => { setCurrentCustomerView('list'); setSelectedCustomer(null); }} />
                  )}
                </>
              )}
              {activeTab === 'calendar' && (
                <CalendarView 
                  currentUser={currentUser}
                  properties={myProperties}
                  memos={memos}
                  setMemos={setMemos}
                  onDbError={handleSupabaseError}
                />
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
