  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const safeStorage = {
      getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return window['temp_' + key] || null; } },
      setItem: (key, val) => { try { localStorage.setItem(key, val); } catch (e) { window['temp_' + key] = val; } },
      removeItem: (key) => { try { localStorage.removeItem(key); } catch (e) { delete window['temp_' + key]; } }
    };

    const SUPABASE_URL = "https://ehshoqcskipcvybhomlq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_v5aUCKdYsRAtiwKSjn8oSA_GnuPEe4G";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storage: safeStorage, storageKey: 'building_tab_crm_session', autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
    });

    const toDB = (prop) => {
      const dbObj = { ...prop };
      const excludeKeys = ['sale', 'deposit', 'rent', 'maintenance', 'direction'];
      excludeKeys.forEach(k => delete dbObj[k]);

      const keyMap = { ownerName: 'ownername', ownerPhone: 'ownerphone', transactionType: 'transactiontype', landArea: 'landarea', totalFloorArea: 'totalfloorarea', buildingArea: 'buildingarea', groundFloorArea: 'groundfloorarea', buildingCoverage: 'buildingcoverage', floorAreaRatio: 'floorarearatio', floorUnderground: 'floorunderground', floorGround: 'floorground', completionYear: 'completionyear', floorDetails: 'floordetails', workLogs: 'worklogs', registrantPhone: 'registrantphone' };
      for (const [camel, lower] of Object.entries(keyMap)) {
        if (dbObj[camel] !== undefined) { dbObj[lower] = dbObj[camel]; delete dbObj[camel]; }
      }
      return dbObj;
    };

    const fromDB = (row) => {
      const prop = { ...row };
      const keyMap = { ownername: 'ownerName', ownerphone: 'ownerPhone', transactiontype: 'transactionType', landarea: 'landArea', totalfloorarea: 'totalFloorArea', buildingarea: 'buildingArea', groundfloorarea: 'groundFloorArea', buildingcoverage: 'buildingCoverage', floorarearatio: 'floorAreaRatio', floorunderground: 'floorUnderground', floorground: 'floorGround', completionyear: 'completionYear', floordetails: 'floorDetails', worklogs: 'workLogs', registrantphone: 'registrantPhone' };
      for (const [lower, camel] of Object.entries(keyMap)) {
        if (prop[lower] !== undefined) { prop[camel] = prop[lower]; delete prop[lower]; }
      }
      return prop;
    };

    const getYield = (sale, deposit, rent) => {
      const s = Number(sale) || 0; const d = Number(deposit) || 0; const r = Number(rent) || 0;
      if (s === 0 || s <= d || r === 0) return '0.0';
      return (((r * 12) / (s - d)) * 100).toFixed(1);
    };

    const getPricePerPyeong = (sale, landArea) => {
      if (!sale || !landArea) return 0;
      return Math.round(sale / (landArea * 0.3025));
    };

    const formatKoreanCurrency = (val) => {
      const num = Number(val);
      if (!num || isNaN(num) || num === 0) return '0원';
      if (num >= 10000) {
        const eok = num / 10000;
        return Number.isInteger(eok) ? `${eok}억` : `${eok.toFixed(1)}억`;
      }
      return `${num.toLocaleString('ko-KR')}만`;
    };

    const autoFormatAddress = (addr) => {
      if (!addr) return ''; 
      return addr.replace(/\s{2,}/g, ' ').trim();
    };

    // 금액 입력칸: 화면에는 콤마(1,800,000), 저장 값은 숫자만
    // 만원 단위 숫자를 "3,333억 3,333만원"처럼 빠짐없이 보여 준다
    const formatKoreanMoneyFull = (val) => {
      const n = Math.round(Number(String(val === undefined || val === null ? '' : val).replace(/,/g, '')));
      if (!n || isNaN(n)) return '0원';
      const eok = Math.floor(n / 10000), man = n % 10000;
      return [eok ? `${eok.toLocaleString('ko-KR')}억` : '', man ? `${man.toLocaleString('ko-KR')}만원` : ''].filter(Boolean).join(' ');
    };
    const BUILDING_TYPES = ['빌딩', '상가', '오피스텔', '아파트', '빌라', '원룸', '투룸', '쓰리룸+'];
    // 억 단위 숫자를 "33.5억"처럼 보여 준다
    const formatEok = (v) => { const n = Number(String(v === undefined || v === null ? '' : v).replace(/,/g, '')); return !n || isNaN(n) ? '0억' : n.toLocaleString('ko-KR', { maximumFractionDigits: 4 }) + '억'; };
    const fmtMoneyInput = (v) => { const t = String(v === undefined || v === null ? '' : v).replace(/,/g, ''); if (t === '') return ''; const [i, d] = t.split('.'); return (Number(i) || 0).toLocaleString('ko-KR') + (d !== undefined ? '.' + d : ''); };
    const cleanMoneyInput = (t) => t.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');

    const getExactPyeong = (sqm) => ((Number(sqm) || 0) * 0.3025).toFixed(2);

    // ───────── PDF 매물 소개서 읽기 ─────────
    // ── PDF 매물 소개서 → 물건카드 항목 (브라우저/Node 공용, 순수 함수) ──
    // pages: [{ width, items: [{ s, x, y, w }] }]  (y는 위에서 아래로 커지는 값)
    function pdfGroupLines(items) {
      const sorted = [...items].sort((a, b) => a.y - b.y || a.x - b.x);
      const lines = [];
      for (const it of sorted) {
        const last = lines[lines.length - 1];
        if (last && Math.abs(it.y - last.y) <= 4) { last.items.push(it); last.y = (last.y * (last.items.length - 1) + it.y) / last.items.length; }
        else lines.push({ y: it.y, items: [it] });
      }
      return lines.map(l => {
        const cells = [];
        for (const it of l.items.sort((a, b) => a.x - b.x)) {
          const c = cells[cells.length - 1];
          if (c && it.x - c.x2 < 14) { c.s += (it.x - c.x2 > 1.5 ? ' ' : '') + it.s; c.x2 = Math.max(c.x2, it.x + it.w); }
          else cells.push({ s: it.s, x: it.x, x2: it.x + it.w });
        }
        const clean = cells.map(c => ({ ...c, s: c.s.replace(/\s+/g, ' ').trim() })).filter(c => c.s);
        const merged = [];
        for (const c of clean) {
          const p = merged[merged.length - 1];
          const short = (t) => t.replace(/\s/g, '').length <= 2 && /^[가-힣]/.test(t);
          if (p && short(p.s) && short(c.s) && c.x - p.x2 < 40) { p.s += c.s; p.x2 = c.x2; } else merged.push({ ...c });
        }
        return { y: l.y, cells: merged };
      });
    }

    function parsePropertyPdf(pages, opts) {
      opts = opts || {};
      const norm = (t) => t.replace(/[\s·ㆍ:：]/g, '');
      // 금액 → 만원 단위 숫자. "180억원"→1,800,000 / "5억 3,500만원"→53,500 / "3,110만원"→3,110 / "1,000,000 만원"→1,000,000 / 숫자만 있으면 만원으로 본다
      const parseMan = (t) => {
        const s = String(t || '').replace(/,/g, '').replace(/\s+/g, '');
        const eok = s.match(/(\d+(?:\.\d+)?)억/), man = s.match(/(\d+(?:\.\d+)?)만/);
        if (eok || man) return (eok ? Number(eok[1]) * 10000 : 0) + (man ? Number(man[1]) : 0);
        if (/원\/|원$/.test(s) && !/만원$/.test(s)) return null;      // "109,322,806 원/평" 같은 원 단위 값은 건너뜀
        const n = s.match(/^\d+(?:\.\d+)?$/); return n ? Number(n[0]) : null;
      };
      const LABELS = [
        ['address', /^(소재지|물건주소)$/], ['location', /^물건위치$/], ['structure', /^구조$/], ['usage', /^사용용도$/], ['rentStatus', /^임대현황$/], ['expRent', /^예상임대료$/], ['station', /^주변역$/], ['road', /^도로(조건|상황|현황)$/],
        ['landArea', /^대지면적$/], ['landArea2', /^면적$/], ['zoning', /^(용도)?지역$/], ['publicPrice', /^공시지가$/],
        ['completion', /^(준공|사용승인)/], ['totalFloorArea', /^연면적$/], ['buildingArea', /^건축면적$/],
        ['floors', /^(층수|(건축)?규모)$/], ['ratios', /^건폐율.*용적[률율]$/], ['coverage', /^건폐율$/], ['far', /^용적[률율]$/],
        ['mainUse', /^주용도/], ['parking', /^주차(장|대수)?$/], ['elevator', /^승강기$/], ['heating', /^냉난방$/],
        ['deposit', /^보증금$/], ['rent', /^(월)?임대료$/], ['maint', /^관리비$/], ['yield', /^(년)?수익[률율]$/], ['bond', /^채권최고액$/],
        ['buildingPerPy', /^건물가/], ['landPerPy', /^토지가/], ['perPy', /^평단가$/], ['monthIncome', /^월수익$/], ['maintExpense', /^관리비지출$/], ['sale', /^매매(가|금액)$/]
      ];
      const labelOf = (s) => { const n = norm(s); const f = LABELS.find(([, re]) => re.test(n)); return f ? f[0] : null; };
      const joinSpaced = (t) => /^(?:[가-힣]\s)+[가-힣]$/.test(t || '') ? t.replace(/\s+/g, '') : (t || '').trim();   // "사 무 소"→"사무소", "롯데 리아"는 그대로

      const featureNotes = [];
      const raw = {}; const notes = []; const floorsOut = []; let coverName = '', markName = ''; let addrLabel = null;
      const allLines = [];
      const ADDR_RE = /[가-힣]+(?:구|군|시)\s+[가-힣0-9]+(?:동|읍|면|리|가)\s*\d+(?:-\d+)?(?:번지)?|[가-힣]+(?:구|군|시)\s+[가-힣0-9]+(?:로|길)\s*\d+(?:-\d+)?/;
      pages.forEach((pg, pi) => {
        const lines = pdfGroupLines(pg.items.filter(it => it.s.trim() !== '내용작성')); allLines.push(lines);

        if (pi === 0 && lines.length) {
          // (a) 표지: 글자가 거의 없는 첫 장에서 주소 줄 앞의 글자 = 물건명
          if (!lines.some(l => l.cells.some(c => labelOf(c.s)))) {
            const texts = lines.map(l => l.cells.map(c => c.s).join(' ').trim()).filter(Boolean);
            const idx = texts.findIndex(t => /번지|\d+-\d+/.test(t));
            if (idx >= 0) {
              const m = texts[idx].match(/^(.*?\d+(?:-\d+)?(?:번지)?)\s+(\S.*)$/);
              if (m) coverName = m[2].trim(); else if (idx > 0) coverName = texts.slice(0, idx).join(' ').trim();
            }
          }
          // (b) '◎ 이름' 형태의 제목
          lines.forEach(l => l.cells.forEach(c => { if (!markName && /^◎\s*\S/.test(c.s)) markName = c.s.replace(/^◎\s*/, '').trim(); }));
        }

        // 이름 칸 → 값 칸
        const pending = [];
        lines.forEach(line => {
          let cur = null;
          line.cells.forEach(c => {
            const key = labelOf(c.s);
            if (key) { cur = key; if (!(key in raw)) { raw[key] = []; pending.push({ key, y: line.y, x2: c.x2 }); if (key === 'address') addrLabel = { pi, y: line.y }; } else cur = '__dup__'; return; }
            if (/^[▶▪]/.test(c.s)) return;                         // 참고 문장은 값이 아님
            if (cur && cur !== '__dup__') raw[cur].push(c.s);
          });
          line.cells.forEach(c => { if (/^[▶▪]/.test(c.s)) notes.push(c.s.replace(/^[▶▪]\s*/, '').trim()); });
        });
        if (lines.some(l => l.cells.some(c => labelOf(c.s)))) lines.forEach(l => l.cells.forEach(c => {
          if (/^\d{1,2}\.\s+[가-힣]/.test(c.s) && c.s.length > 6) notes.push(c.s.replace(/^\d+\.\s*/, '').trim());
          else if (c.s.startsWith('■') && c.s.replace(/\s/g, '').length > 14) notes.push(c.s.replace(/^■\s*/, '').trim());
        }));
        if (lines.some(l => l.cells.some(c => /건물의\s*특징|^◆\s*특징$/.test(c.s)))) {
          let curNote = null;
          lines.forEach(l => l.cells.forEach(c => {
            const t = c.s.trim();
            if (!t || /^\d{1,3}$/.test(t) || /건물의\s*특징|^◆\s*특징$|^THANKS/.test(t)) return;
            const m = t.match(/^\d{1,2}\.\s*(.+)$/);
            if (m) { curNote = { t: m[1] }; featureNotes.push(curNote); } else if (curNote) curNote.t += ' ' + t;
          }));
        }
        pending.forEach(pd => {
          if (!['address', 'zoning'].includes(pd.key) || raw[pd.key].length) return;
          const cand = lines.filter(l => !l.cells.some(c => labelOf(c.s)) && Math.abs(l.y - pd.y) <= 20 && l.cells.some(c => c.x >= pd.x2 - 2 && !/^[▶▪]/.test(c.s)))
            .sort((a, b) => Math.abs(a.y - pd.y) - Math.abs(b.y - pd.y))[0];
          if (cand) raw[pd.key] = cand.cells.filter(c => c.x >= pd.x2 - 2 && !/^[▶▪]/.test(c.s)).map(c => c.s);
        });

        // 층별 현황 표 (머리글 예: 층 | 임차인현황/업종/업체명 | (건축)면적 | 보증금 | (월)임대료 | 관리비 | 비고/임대만기)
        const headName = (n) => /^(층|B\/F)$/i.test(n) ? 'floor' : /^(임차인현황|업종|업체명|임차인|용도)$/.test(n) ? 'tenant' : /^(건축)?면적/.test(n) ? 'area' : /^보증금/.test(n) ? 'deposit' : /임대료/.test(n) ? 'rent' : /^관리비/.test(n) ? 'maint' : /^(비고|임대만기|계약기간)$/.test(n) ? 'note' : null;
        const hi = lines.findIndex(l => l.cells.some(c => headName(norm(c.s)) === 'floor') && l.cells.some(c => headName(norm(c.s)) === 'tenant') && l.cells.some(c => headName(norm(c.s)) === 'note'));
        if (hi >= 0) {
          const hy = lines[hi].y;
          const cols = []; const headTexts = [];
          lines.forEach(l => { if (Math.abs(l.y - hy) <= 16) l.cells.forEach(c => { const n = norm(c.s); headTexts.push(n); const h = headName(n); if (h) cols.push({ name: h, cx: (c.x + c.x2) / 2 }); }); });
          const won = headTexts.some(t => /\(원\)/.test(t)) && !headTexts.some(t => /\(만원\)/.test(t));   // 금액 단위가 '원'이면 만원으로 바꾼다
          const colOf = (cx) => { let best = cols[0], d = 1e9; cols.forEach(c => { const dd = Math.abs(c.cx - cx); if (dd < d) { d = dd; best = c; } }); return best ? best.name : 'note'; };
          const isFloor = (t) => /^(B\d+F?|-?\d+F?|지하\d+층?|\d+층|\d+\/\d+|옥상|옥탑|PH)$/i.test(t.replace(/\s+/g, ''));
          const pageRows = []; const orphans = []; const marks = [];
          const dataCols = ['tenant', 'deposit', 'rent', 'maint'];
          lines.forEach(l => {
            if (l.y <= hy + 16) return;
            if (l.cells.some(c => /^(합계|계|총계)$/.test(c.s.replace(/\s+/g, '')))) return;
            const fc = l.cells.find(c => isFloor(c.s) && colOf((c.x + c.x2) / 2) === 'floor');
            const hasOther = l.cells.some(c => c !== fc && colOf((c.x + c.x2) / 2) !== 'note');
            if (fc && !hasOther) { marks.push({ f: fc.s.replace(/\s+/g, ''), y: l.y }); return; }   // 위아래 칸이 합쳐진 층 칸(값 없이 층만 있는 줄)
            const hasData = l.cells.some(c => c !== fc && dataCols.includes(colOf((c.x + c.x2) / 2)));
            if (fc || hasData) {
              const row = {}; const frags = [];
              l.cells.forEach(c => { if (c === fc) return; const k = colOf((c.x + c.x2) / 2); if (k === 'note') frags.push({ y: l.y, t: c.s }); else row[k] = (row[k] ? row[k] + ' ' : '') + c.s; });
              pageRows.push({ f: fc ? fc.s.replace(/\s+/g, '') : null, row, y: l.y, frags, won });

    function FloorMoneyInput({ label, value, onChange }) { return <div className="w-full min-w-0" title={value ? formatKoreanCurrency(value) : ''}><label className="block text-xs font-bold text-slate-500 mb-1 pl-0.5 md:hidden">{label}<span className="text-blue-600 ml-1">{value ? formatKoreanCurrency(value) : ''}</span></label><div className="flex items-center border border-slate-300 rounded-lg bg-white focus-within:border-blue-500 focus-within:ring-1 overflow-hidden shadow-sm transition-all"><input type="text" inputMode="decimal" value={fmtMoneyInput(value || '')} onChange={(e) => onChange({ target: { value: cleanMoneyInput(e.target.value) } })} className="w-full min-w-0 py-3 md:py-2 px-2 text-right text-sm font-bold outline-none bg-transparent" placeholder="0" /><span className="text-xs font-bold text-slate-500 pr-2 whitespace-nowrap">만원</span></div></div>; }
    function FloorTextInput({ value, onChange, onBlur, autoFocus }) { return <div className="w-28 md:w-auto shrink-0"><div className="flex items-center border border-slate-300 rounded-lg bg-white focus-within:border-blue-500 focus-within:ring-1 overflow-hidden shadow-sm transition-all"><span className="bg-slate-100 text-xs font-bold text-slate-600 px-2 py-3 border-r border-slate-200 whitespace-nowrap md:hidden">층수</span><input type="text" value={value || ''} onChange={onChange} onBlur={onBlur} autoFocus={autoFocus} className="w-full min-w-0 py-3 md:py-2 px-2 text-center text-sm font-bold outline-none bg-transparent" placeholder="1층" /></div></div>; }
    function CompanyTextInput({ value, onChange }) { return <div className="flex-1 min-w-0 md:flex-none"><div className="flex items-center border border-slate-300 rounded-lg bg-white focus-within:border-blue-500 focus-within:ring-1 overflow-hidden shadow-sm transition-all"><span className="bg-slate-100 text-xs font-bold text-slate-600 px-2 py-3 border-r border-slate-200 whitespace-nowrap md:hidden">업체명</span><input type="text" value={value || ''} onChange={onChange} className="w-full min-w-0 py-3 md:py-2 px-2 text-sm font-bold outline-none bg-transparent" placeholder="상호명/비고" /></div></div>; }
    function FloorMoneyInputReadOnly({ label, value }) { return <div className="w-full min-w-0"><label className="block text-xs font-bold text-blue-800 mb-1 pl-0.5 md:hidden">{label}</label><div className="flex items-center border border-blue-200 rounded-lg bg-white overflow-hidden shadow-sm"><div className="w-full min-w-0 py-3 md:py-2 px-2 text-right text-sm font-extrabold text-ink-900 truncate">{value.toLocaleString()}</div><span className="text-xs font-bold text-slate-500 pr-2 whitespace-nowrap">만원</span></div></div>; }

    function PropertyReportView({ property, onBack, currentUser }) {
      const [consultantInfo, setConsultantInfo] = useState({
        name: currentUser?.name || '담당자명',
        phone: currentUser?.phone || '연락처'
      });

      const [customFields, setCustomFields] = useState({
        headline: '',          // 표지 맨 위 한 줄 (예: 급매물 – 23년 매입가 68억, 79억에서 대폭 조정)
        summary: '',           // 개요 쪽 맨 위 요약 띠
        location: '',
        roadCond: '',
        landPrice: '',
        structure: '',
        usage: '',
        elevator: property?.elevators ? `${property.elevators}대` : '無',
        saleNote: ''
      });
      const [rentNotes, setRentNotes] = useState('');
      const [rentExtra, setRentExtra] = useState({});   // 층별로 따로 적는 값: 바닥면적(㎡), 전용면적(평), 임대시작, 비고
      const setExtra = (id, key, value) => setRentExtra(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [key]: value } }));
      const [photoPages, setPhotoPages] = useState(() => [{ id: 'pp-1', title: '건물 사진', photos: (property?.images || []).slice(0, 4) }]);

      const [images, setImages] = useState({
        main: property?.images?.[0] || null,
        cover1: null,
        cover2: null,
        map: null,
        ledger: null,
        landPlan: null
      });

      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
      const [pdfPreviewUrl, setPdfPreviewUrl] = useState(null);

      // 사진은 가로 1600px 안으로 줄여서 쓴다 (PDF가 너무 무거워지는 것을 막는다)
      const fileToImage = (file) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onerror = () => resolve(null);
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => resolve(reader.result);
          img.onload = () => {
            const max = 1600, ratio = Math.min(1, max / Math.max(img.width, img.height));
            if (ratio === 1 && file.size < 600000) return resolve(reader.result);
            const c = document.createElement('canvas'); c.width = Math.round(img.width * ratio); c.height = Math.round(img.height * ratio);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.85));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      const handleImageUpload = async (e, key) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const data = await fileToImage(file);
        if (data) setImages(prev => ({ ...prev, [key]: data }));
      };

      const addPhotoPage = () => setPhotoPages(prev => [...prev, { id: 'pp-' + Date.now(), title: `${prev.length + 1}번째 사진`, photos: [] }]);
      const removePhotoPage = (id) => { if (confirm('이 사진 쪽을 지울까요?')) setPhotoPages(prev => prev.filter(pg => pg.id !== id)); };
      const setPhotoTitle = (id, title) => setPhotoPages(prev => prev.map(pg => pg.id === id ? { ...pg, title } : pg));
      const addPhotos = async (id, fileList) => {
        const files = [...fileList];
        const room = 4 - (photoPages.find(pg => pg.id === id)?.photos.length || 0);
        if (files.length > room) alert('한 쪽에는 사진을 4장까지 넣을 수 있어요. 남는 사진은 "사진 페이지 추가"로 새 쪽에 넣어 주세요.');
        const imgs = (await Promise.all(files.slice(0, Math.max(room, 0)).map(fileToImage))).filter(Boolean);
        setPhotoPages(prev => prev.map(pg => pg.id === id ? { ...pg, photos: [...pg.photos, ...imgs].slice(0, 4) } : pg));
      };
      const removePhoto = (id, idx) => setPhotoPages(prev => prev.map(pg => pg.id === id ? { ...pg, photos: pg.photos.filter((_, i) => i !== idx) } : pg));

      const handleCustomFieldChange = (key, value) => {
        setCustomFields(prev => ({ ...prev, [key]: value }));
      };

      const handleExportPDF = async () => {
         setIsGeneratingPdf(true);
         await new Promise(resolve => setTimeout(resolve, 150)); // UI 렌더링 및 안정화 대기

         const container = document.getElementById('premium-report-container');

         const opt = {
            margin: 0,
            filename: `${property.name}_투자제안서.pdf`,
            image: { type: 'jpeg', quality: 1.0 },
            html2canvas: { 
                scale: 2, 
                useCORS: true, 
                scrollY: 0, 
                scrollX: 0,
                windowWidth: 1122,
                onclone: (clonedDoc) => {
                    // 🚨 [빈 페이지 및 왼쪽 쏠림 완벽 해결]
                    // 실제 라이브 화면의 CSS를 절대 조작하지 않고, 캡처를 위해 복제된(Clone) DOM의 스타일만 수정합니다.
                    // 이렇게 하면 Vercel, GitHub 등 배포 환경에서 겪는 엄격한 overflow 차단 현상을 우회할 수 있습니다.
                    const el = clonedDoc.getElementById('premium-report-container');
                    if (el) {
                        el.style.width = '1122px';
                        el.style.margin = '0';
                        el.style.padding = '0';
                        el.style.position = 'relative'; // absolute 쏠림 방지
                        el.querySelectorAll('input, textarea').forEach(i => { i.placeholder = ''; });   // 비어 있는 칸의 안내 글씨는 PDF에 찍지 않는다

                        // 상위 부모들의 화면 가림(overflow) 속성을 복제된 DOM 내에서만 완전 해제
                        let parent = el.parentElement;
                        while (parent && parent !== clonedDoc.body) {
                            parent.style.overflow = 'visible';
                            parent.style.position = 'static';
                            parent.style.transform = 'none';
                            parent = parent.parentElement;
                        }

                        // 내부 용지 규격 고정
                        const pages = el.querySelectorAll('.report-page');
                        pages.forEach((p) => {
                            p.style.width = '1122px';
                            p.style.height = '793px';
                            p.style.margin = '0';
                        });
                    }
                }
            },
            jsPDF: { unit: 'px', format: [1122, 793], orientation: 'landscape', hotfixes: ["px_scaling"] }
         };
         
         // 화면용 쪽 사이 간격(32px)과 바깥 여백이 그대로 찍히면 PDF 쪽이 점점 밀리고 빈 쪽이 생긴다.
         // 찍는 동안만 없애고, 끝나면 되돌린다.
         const saved = { gap: container.style.gap, padding: container.style.padding };
         container.style.gap = '0px';
         container.style.padding = '0px';
         await new Promise(resolve => setTimeout(resolve, 60));
         try {
            const pdfBlob = await html2pdf().set(opt).from(container).output('blob');
            const blobUrl = URL.createObjectURL(pdfBlob);
            setPdfPreviewUrl(blobUrl); 
         } catch(error) {
            console.error("PDF 생성 에러:", error);
            alert("PDF 생성 중 오류가 발생했습니다.");
         } finally {
            container.style.gap = saved.gap;
            container.style.padding = saved.padding;
            setIsGeneratingPdf(false); 
         }
      };

      if (!property) return null;

      const floorTotals = (property.floorDetails || []).reduce((acc, curr) => ({
        deposit: acc.deposit + (Number(curr.deposit) || 0),
        rent: acc.rent + (Number(curr.rent) || 0),
        maintenance: acc.maintenance + (Number(curr.maintenance) || 0),
      }), { deposit: 0, rent: 0, maintenance: 0 });

      const ph = (t) => (isGeneratingPdf ? '' : t);   // PDF를 찍는 동안에는 안내 글씨를 지운다
      // 개요 쪽 표: 참고 PDF처럼 묶음마다 떨어뜨리고, 칸마다 이름 칸(연한 파랑)과 값 칸으로 나눈다
      const cellL = (w) => `${w} h-full flex items-center justify-center bg-[#e6ecf5] text-slate-800 font-semibold border-r border-slate-400 whitespace-nowrap`;
      const cellV = (w, last) => `${w} h-full flex items-center justify-center px-2 font-bold text-ink-900 text-center ${last ? '' : 'border-r border-slate-400'}`;
      const ovRow = (label, value) => (
        <div className="flex items-center border-b border-slate-400 last:border-b-0 h-[30px]">
          <div className={cellL('w-[24%]')}>{label}</div>
          <div className={cellV('w-[76%]', true)}>{value}</div>
        </div>

      const ovPair = (l1, v1, l2, v2) => (
        <div className="flex items-center border-b border-slate-400 last:border-b-0 h-[30px]">
          <div className={cellL('w-[24%]')}>{l1}</div>
          <div className={cellV('w-[26%]')}>{v1}</div>
          <div className={cellL('w-[22%]')}>{l2}</div>
          <div className={cellV('w-[28%]', true)}>{v2}</div>
        </div>
      );
      const ovGroup = (children) => <div className="border border-slate-500 text-[14px]">{children}</div>;
      const fieldInput = "w-full h-[28px] py-0 text-[14px] text-center text-ink-900 bg-transparent outline-none font-bold hover:bg-blue-50 focus:bg-blue-50 placeholder:text-slate-300 placeholder:font-medium";

      const renderFooter = () => (
        <div className="absolute bottom-0 left-0 right-0 h-[50px] bg-slate-50 border-t border-slate-200 flex justify-between items-center px-10 shrink-0 z-50">
           <div className="flex items-center gap-2">
             <div className="w-5 h-5 bg-slate-900 flex items-center justify-center rounded-sm"><Building2 className="w-3 h-3 text-white" /></div>
             <span className="text-ink-800 font-bold text-xs tracking-widest uppercase">PREMIUM PROPERTY CONSULTING</span>
           </div>
           <div className="text-slate-600 text-xs font-bold flex items-center gap-3">
             <span>담당자: {consultantInfo.name}</span>
             <span className="text-slate-300">|</span>
             <span>{consultantInfo.phone}</span>
           </div>
        </div>
      );

      const renderImageUploader = (imageKey, icon, label, subLabel) => (
        <div className={`w-full h-full bg-slate-100 relative group overflow-hidden border border-slate-200 rounded-3xl ${images[imageKey] ? "" : "print:bg-white print:border-0"}`}>
           {images[imageKey] ? (
             <img src={images[imageKey]} className="w-full h-full object-contain bg-white" />
           ) : (
             <div className="print:hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-6 text-center bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer">
                {icon}
                <p className="text-sm font-bold text-slate-500 mb-1">{label}</p>
                <p className="text-xs text-slate-400">{subLabel}</p>
             </div>
           )}
           <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, imageKey)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="클릭하여 이미지 업로드" />
        </div>
      );

      return (
        <div className="w-full mx-auto pb-20 overflow-x-auto bg-slate-200 print:bg-white print:overflow-visible print:pb-0">
          
          {/* 💡 1. PDF 생성 로딩 화면 */}
          {isGeneratingPdf && (
             <div className="fixed inset-0 z-[999999] bg-white flex flex-col items-center justify-center">
                 <div className="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-6"></div>
                 <h2 className="text-2xl font-black text-ink-800 mb-2">고화질 PDF 미리보기를 준비하고 있습니다</h2>
                 <p className="text-slate-500 font-medium">데이터 용량에 따라 3~10초 정도 소요될 수 있습니다. 잠시만 기다려주세요.</p>
             </div>
          )}

          {/* 💡 2. PDF 미리보기 모달창 (크롬 차단 대비 완벽 처리) */}
          {pdfPreviewUrl && (
             <div className="fixed inset-0 z-[999999] bg-slate-900/90 flex flex-col p-4 sm:p-8">
                 <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 bg-white p-4 rounded-3xl shadow-lg shrink-0 gap-4">
                     <div>
                         <h3 className="text-lg sm:text-xl font-bold text-ink-800 flex items-center gap-2"><FileText className="w-6 h-6 text-red-500" /> PDF 미리보기 및 다운로드</h3>
                         <p className="text-xs sm:text-sm text-slate-500 mt-1">※ 흰 화면이 나오거나 차단 표시가 뜨면 브라우저 보안 정책 때문이니 <strong className="text-blue-600">내 PC에 저장</strong> 버튼을 눌러주세요.</p>
                     </div>
                     <div className="flex gap-2 sm:gap-3 w-full sm:w-auto">
                         <button onClick={() => setPdfPreviewUrl(null)} className="flex-1 sm:flex-none px-4 sm:px-5 py-2.5 bg-slate-200 text-ink-800 font-bold rounded-lg hover:bg-slate-300 transition-colors text-sm sm:text-base">닫기</button>
                         <a href={pdfPreviewUrl} download={`${property.name}_투자제안서.pdf`} className="flex-[2] sm:flex-none px-4 sm:px-5 py-2.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 text-sm sm:text-base shadow-sm">
                             <i className="fas fa-download"></i> 내 PC에 저장
                         </a>
                     </div>
                 </div>
                 <div className="flex-1 w-full bg-slate-100 rounded-3xl overflow-hidden shadow-2xl relative">
                     {/* 💡 iframe으로 PDF 표출. 차단되었을 경우 배경에 친절한 안내 메시지가 나타남 */}
                     <iframe src={`${pdfPreviewUrl}#view=FitH`} className="w-full h-full border-0 absolute inset-0 z-10 bg-transparent" title="PDF 미리보기"></iframe>
                     <div className="absolute inset-0 flex flex-col items-center justify-center bg-white text-slate-500 p-6 text-center z-0">
                         <FileText className="w-16 h-16 mb-4 text-slate-300" />
                         <p className="font-bold text-lg sm:text-xl mb-2 text-slate-700">PDF 파일이 성공적으로 생성되었습니다.</p>
                         <p className="text-sm sm:text-base">미리보기가 로드되지 않았다면 상단의 다운로드 버튼을 이용해주세요.</p>
                     </div>
                 </div>
             </div>
          )}

          <div className="no-print flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm border border-slate-200 mb-6 sticky top-0 z-50 min-w-[1122px] mx-auto max-w-[1300px]">
             <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-ink-800 font-bold px-4 py-2 rounded-lg hover:bg-slate-100 transition-colors"><ArrowLeft className="w-4 h-4"/> 뒤로가기</button>
             <div className="flex gap-3">
                <button onClick={addPhotoPage} className="px-6 py-2.5 bg-white border border-slate-300 text-slate-700 font-bold rounded-lg shadow-sm hover:bg-slate-50 transition-colors">+ 사진 페이지 추가</button>
                <button onClick={() => window.print()} className="px-6 py-2.5 bg-slate-800 text-white font-bold rounded-lg shadow-sm hover:bg-slate-900 transition-colors flex items-center gap-2"><i className="fas fa-print"></i> 종이 인쇄</button>
                <button onClick={handleExportPDF} className="px-6 py-2.5 bg-blue-600 text-white font-bold rounded-lg shadow-sm hover:bg-blue-700 transition-colors flex items-center gap-2"><i className="fas fa-file-pdf"></i> PDF 미리보기 / 다운로드</button>
             </div>
          </div>

          <div id="premium-report-container" className="flex flex-col gap-8 p-8 items-center origin-top print:p-0 print:gap-0">
             
             {/* 1장: 표지 */}
             <div className="report-page w-[1122px] h-[793px] bg-white shadow-2xl relative overflow-hidden shrink-0">
                <div className="absolute left-0 top-0 w-full h-[460px] overflow-hidden bg-gradient-to-b from-[#3a4a63] to-[#1c2a45]">
                   <img src={images.cover1 || images.main || DEFAULT_COVER_PHOTO} className="absolute inset-0 w-full h-full object-cover" style={{ objectPosition: 'center bottom' }} />
                   <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'cover1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="클릭하여 표지 사진 올리기" data-html2canvas-ignore="true" />
                </div>
                <div className="absolute z-40 left-16 top-[20px] w-[760px]">
                   <input type="text" value={customFields.headline} onChange={e => handleCustomFieldChange('headline', e.target.value)} placeholder={ph("맨 위 한 줄 입력 (예: 급매물 – 23년 매입가 68억, 79억에서 대폭 조정)")} className="bg-[#1c355e]/85 outline-none text-[#ffe14d] font-black text-[22px] w-full placeholder:text-white/50 hover:bg-[#1c355e] focus:bg-[#1c355e] rounded px-3 py-1" />
                </div>
                <div className="absolute z-40 left-16 top-[500px] w-[960px] pointer-events-none">
                   <p className="text-[#2f55e6] font-bold tracking-[0.35em] text-sm mb-3 uppercase">Information Memorandum</p>
                   <h1 className="text-[#1c355e] text-[60px] leading-[1.12] mb-4 break-keep" style={{ fontFamily: "'Pretendard', -apple-system, sans-serif", fontWeight: 900 }}>{property.name}</h1>
                   <p className="text-slate-500 text-[24px] font-semibold">{property.address}</p>
                </div>
                <div className="absolute z-40 left-16 bottom-12 pointer-events-none">
                   <p className="text-slate-400 text-xs tracking-widest uppercase mb-1 ml-1">Consultant</p>
                   <div className="flex items-center text-[#1c355e] font-bold text-xl pointer-events-auto">
                      <input type="text" value={consultantInfo.name} onChange={e => setConsultantInfo({...consultantInfo, name: e.target.value})} className="bg-transparent outline-none w-[110px] px-1 hover:bg-slate-100 focus:bg-slate-100 rounded transition-colors" title="클릭하여 이름 수정" />
                      <span className="text-slate-300 mx-2">|</span>
                      <input type="text" value={consultantInfo.phone} onChange={e => setConsultantInfo({...consultantInfo, phone: e.target.value})} className="bg-transparent outline-none w-[190px] px-1 hover:bg-slate-100 focus:bg-slate-100 rounded transition-colors" title="클릭하여 연락처 수정" />
                   </div>

             </div>

             {/* 2장: 개요 */}
             <div className="report-page w-[1122px] h-[793px] bg-white shadow-2xl relative shrink-0 flex flex-col">
                <div className="h-[70px] bg-[#1c355e] flex items-center px-10 justify-between shrink-0">
                   <h2 className="text-white font-bold text-xl flex items-center gap-3"><Building2 className="w-5 h-5 text-[#D4AF37]"/> 물건 개요</h2>
                   <span className="text-[#D4AF37] font-bold tracking-widest text-sm">{property.name}</span>
                </div>
                <div className="px-6 pt-3">
                   <input type="text" value={customFields.summary} onChange={e => handleCustomFieldChange('summary', e.target.value)} placeholder={ph("한 줄 요약 입력 (예: 급매, 역 도보 6분, 23년 준공, 6m 도로 접, 수익률 3.4%)")} className="w-full bg-[#1c355e] text-[#ffe14d] font-bold text-[18px] h-[42px] py-0 px-4 outline-none rounded-md placeholder:text-white/40 placeholder:font-medium text-center" />

                   </div>
                   <div className="w-[53%] h-full flex flex-col gap-2 overflow-hidden">

                        <input type="text" value={pg.title} onChange={e => setPhotoTitle(pg.id, e.target.value)} placeholder={ph("사진 제목")} className="bg-transparent outline-none text-white font-bold text-xl w-[360px] hover:bg-white/10 focus:bg-white/10 rounded px-1 placeholder:text-white/40" />
